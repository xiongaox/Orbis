# Orbis 安卓端 release 构建（正式签名，包名 com.orbis.app）。
# 签名材料经 GitHub Secrets 注入（用户 2026-10-07 决策）：keystore 以 base64 存于
# ANDROID_KEYSTORE_BASE64，凭据为 ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS /
# ANDROID_KEY_PASSWORD；工作流现场落盘 keys/orbis-android.keystore 与
# src-tauri/gen/android/keystore.properties（均被 gitignore，不会入库）。
# 注意：仅普通版——案例激活签发私钥（管理员版材料）永不进入任何远端。
# 私有语料：构建前从 orbis-lore 还原断法/案例正文与加密案例包，见「还原私有语料」步骤。
# 触发：手动运行，或推送 v* 标签发布时；不随普通提交构建。
name: android-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Rust（Android target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 定位 NDK
        run: echo "NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm ci

      # 断法正文（import.meta.glob 内联进前端）与完整案例库（build.rs 嵌入加密包）
      # 都来自 gitignored 的私有语料，构建前必须从 orbis-lore 还原，否则产物内容为空
      #（v2.1.0 云端正式包正是因缺这一步而丢失断法与完整案例）。
      # 凭据：ORBIS_LORE_DEPLOY_KEY = orbis-lore 只读部署密钥，私钥仅存于本仓库 Secrets。
      - name: 检查语料仓凭据
        shell: bash
        env:
          ORBIS_LORE_DEPLOY_KEY: ${{ secrets.ORBIS_LORE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$ORBIS_LORE_DEPLOY_KEY" || { echo "::error::缺少 Secret ORBIS_LORE_DEPLOY_KEY（orbis-lore 只读部署密钥），本次构建拒绝继续以免产出空内容包"; exit 1; }

      - name: 检出私有语料仓 orbis-lore
        uses: actions/checkout@v4
        with:
          repository: xiongaox/orbis-lore
          ssh-key: ${{ secrets.ORBIS_LORE_DEPLOY_KEY }}
          path: orbis-lore
          persist-credentials: false

      - name: 还原私有语料
        shell: bash
        run: |
          set -euo pipefail
          cp -R orbis-lore/corpus/. src/data/cases/
          mkdir -p dist-cases
          cp orbis-lore/dist/cases_v1.enc dist-cases/
          echo "语料还原完成：$(find src/data/cases -name '*.md' | wc -l) 个 md，案例加密包 $(wc -c < dist-cases/cases_v1.enc) 字节"

      - name: 释放签名材料
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::缺少签名 Secret"; exit 1; }
          mkdir -p keys
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keys/orbis-android.keystore
          printf 'storeFile=../../../../keys/orbis-android.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > src-tauri/gen/android/keystore.properties

      - name: 构建 release APK（aarch64）
        run: npx tauri android build --target aarch64

      - name: 重命名 APK（带版本号，英文命名）
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist-apk
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -path '*release*/*.apk' | head -1)
          cp "$APK" "dist-apk/orbis_${VERSION}_release.apk"
          echo "产物：dist-apk/orbis_${VERSION}_release.apk"

      - name: 收集构建产物
        uses: actions/upload-artifact@v4
        with:
          name: orbis-android
          if-no-files-found: error
          path: dist-apk/*.apk

      - name: 发布到 GitHub Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Orbis ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist-apk/*.apk
