# Orbis 桌面端普通版构建（不含任何密钥材料，签发能力仅存在于本地的管理员版构建）。
# 触发：手动运行，或推送 v* 标签发布时。
# 矩阵：macOS 出 Apple Silicon（aarch64）与 Intel（x86_64）两版，Windows 出 x64 与 x86 两版。
name: desktop-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust（含矩阵目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      # 显式 --target：产物落在 target/<三元组>/release/bundle/ 下；
      # Intel mac 与 32 位 Windows 为交叉编译
      - name: 构建普通版（无 admin-signing）
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: 收集构建产物（macOS）
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: orbis-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

      - name: 发布到 GitHub Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Orbis ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: 收集构建产物（Windows）
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: orbis-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: 发布到 GitHub Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Orbis ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
