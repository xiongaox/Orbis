# Orbis 桌面端普通版构建（不含任何密钥材料，签发能力仅存在于本地的管理员版构建）。
# 触发：手动运行，或推送 v* 标签发布时。
name: desktop-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 构建普通版（无 admin-signing）
        run: npm run tauri:build

      - name: 收集构建产物（macOS）
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: orbis-macos
          # tauri build 未指定 --target，宿主机构建产物在 target/release/ 下
          # （不带三元组目录）；找不到文件直接报错，避免静默丢产物
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

      - name: 收集构建产物（Windows）
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: orbis-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
