# Orbis iOS 用户端云端构建（未签名 ipa，供爱思助手等工具用个人 Apple ID 签名后侧载）。
# 本机无完整 Xcode，iOS 构建依赖 runner 自带的 Xcode/iOS SDK；禁用代码签名，
# 从 xcarchive 取出 .app 打包为 Payload/*.ipa。
# 注意：不构建管理员版——签发私钥材料（keys/）永不进入任何远端。
# 私有语料：构建前从 orbis-lore 还原断法/案例正文与加密案例包，见「还原私有语料」步骤。
# 触发：手动运行，或推送 v* 标签发布时；不随普通提交构建。
name: ios-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust（iOS target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      # 断法正文（import.meta.glob 内联进前端）与完整案例库（build.rs 嵌入加密包）
      # 都来自 gitignored 的私有语料，构建前必须从 orbis-lore 还原，否则产物内容为空
      #（v2.1.0 云端正式包正是因缺这一步而丢失断法与完整案例）。
      # 凭据：ORBIS_LORE_DEPLOY_KEY = orbis-lore 只读部署密钥，私钥仅存于本仓库 Secrets。
      - name: 检查语料仓凭据
        shell: bash
        env:
          ORBIS_LORE_DEPLOY_KEY: ${{ secrets.ORBIS_LORE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$ORBIS_LORE_DEPLOY_KEY" || { echo "::error::缺少 Secret ORBIS_LORE_DEPLOY_KEY（orbis-lore 只读部署密钥），本次构建拒绝继续以免产出空内容包"; exit 1; }

      - name: 检出私有语料仓 orbis-lore
        uses: actions/checkout@v4
        with:
          repository: xiongaox/orbis-lore
          ssh-key: ${{ secrets.ORBIS_LORE_DEPLOY_KEY }}
          path: orbis-lore
          persist-credentials: false

      - name: 还原私有语料
        shell: bash
        run: |
          set -euo pipefail
          cp -R orbis-lore/corpus/. src/data/cases/
          mkdir -p dist-cases
          cp orbis-lore/dist/cases_v1.enc dist-cases/
          echo "语料还原完成：$(find src/data/cases -name '*.md' | wc -l) 个 md，案例加密包 $(wc -c < dist-cases/cases_v1.enc) 字节"

      - name: 生成 iOS 工程
        run: |
          brew install xcodegen
          npx tauri ios init
          # tauri ios init 只铺模板自带的 Tauri 默认图标，不会自动使用 tauri icon 的产物
          # （IosConfig 无 assetCatalogs 配置项，模板图标内置在 CLI 二进制里）。
          # 故此处用仓库内的 icons/ios/ 覆盖 appiconset：两边 18 个文件名逐一对应，
          # 不覆盖则 ipa 桌面图标为 Tauri 默认图标（v2.1.2 即如此）。
          APPICONSET="src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset"
          test -d "$APPICONSET" || { echo "::error::未找到 $APPICONSET，tauri ios init 可能失败"; exit 1; }
          test -f src-tauri/icons/ios/AppIcon-512@2x.png || {
            echo "::error::src-tauri/icons/ios/ 缺失；该目录需入库（.gitignore 已放行），否则回退为默认图标"
            exit 1
          }
          COPIED=0
          for f in src-tauri/icons/ios/*.png; do
            name=$(basename "$f")
            if [ -f "$APPICONSET/$name" ]; then
              cp "$f" "$APPICONSET/$name"; COPIED=$((COPIED+1))
            else
              echo "::warning::appiconset 中无同名文件，跳过：$name"
            fi
          done
          echo "已覆盖 $COPIED 个图标"
          test "$COPIED" -ge 15 || { echo "::error::覆盖数量异常（$COPIED），图标可能未生效"; exit 1; }
          # 记录源图指纹，供归档后比对 ipa 内图标是否为项目 logo
          shasum -a 256 src-tauri/icons/ios/AppIcon-512@2x.png | awk '{print $1}' > /tmp/orbis-icon-sha.txt
          echo "源图 sha256: $(cat /tmp/orbis-icon-sha.txt)"

      - name: 构建前端产物
        run: npm run build

      - name: 归档（禁用代码签名）并打包未签名 ipa
        env:
          # xcodebuild 的 Run Script 阶段会调用 cargo，需要能找到它
          PATH: /Users/runner/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          DEVELOPER_DIR: /Applications/Xcode_16.4.app
        run: |
          set -euxo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            DEVELOPER_DIR=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
            export DEVELOPER_DIR
          fi
          echo "使用 Xcode：$DEVELOPER_DIR"
          XCPROJ=$(find src-tauri/gen/apple -maxdepth 1 -name "*.xcodeproj" | head -1)
          echo "Xcode 工程：$XCPROJ"
          # 本项目 iOS 无任何 pod 依赖：跳过 pod install，避免空的 Pods 集成
          # 注入 libPods-app_iOS 链接引用后反而导致链接失败
          echo "pbxproj 中的 Pods 引用："
          (grep -c "Pods" "$XCPROJ/project.pbxproj" || true)
          # xcode-script 阶段要从 {identifier}-server-addr 读取选项通道，手动 xcodebuild
          # 没有官方 build 前置流程写入该文件，这里伪造一个选项服务使脚本阶段可用
          python3 -m venv /tmp/ws-venv
          /tmp/ws-venv/bin/pip install websockets --quiet
          /tmp/ws-venv/bin/python scripts/fake-tauri-ios-server.py &
          SERVER_PID=$!
          sleep 2
          # 确认伪造服务确实提供了 custom-protocol（xcode-script 靠它决定编译模式）
          grep -q 'tauri/custom-protocol' scripts/fake-tauri-ios-server.py \
            || { echo "::error::伪造服务未提供 custom-protocol，产物会是开发模式"; exit 1; }
          printf '127.0.0.1:9876' > "$TMPDIR/com.orbis.app-server-addr"
          SCHEME=$(xcodebuild -list -project "$XCPROJ" | awk '/Schemes:/{flag=1; next} flag && NF {print; exit}' | xargs)
          echo "构建 scheme：$SCHEME"
          find "$XCPROJ/xcshareddata/xcschemes" -name "*.xcscheme" -exec sed -i '' 's/buildConfiguration="Debug"/buildConfiguration="Release"/g' {} +
          xcodebuild -project "$XCPROJ" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/orbis.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          mkdir -p build/Payload
          APP=$(find build/orbis.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          cp -R "$APP" build/Payload/
          # 防回归（闪退根因）：xcode-script 路径不经过 AppInterface::build_options()，
          # 若伪造服务的 features 里漏了 tauri/custom-protocol，编出来的是开发模式二进制——
          # 运行期去找 build.devUrl 而非内嵌资源，装到真机即闪退。
          # 判别特征：启用该 feature 时前端产物会被编进可执行文件，里头能看到 assets/ 下的资源名。
          # 可执行文件名不写死（cargo-mobile2 的产物名随 lib name 变化），从 Info.plist 读。
          APP_DIR=$(find build/Payload -maxdepth 1 -name "*.app" | head -1)
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_DIR/Info.plist")
          test -n "$EXEC_NAME" || { echo "::error::无法从 Info.plist 读取 CFBundleExecutable"; exit 1; }
          # 先用 strings 落盘再 grep：本步开头是 set -o pipefail，而 grep -q 命中后
          # 会提前关闭管道，令上游 strings 收到 SIGPIPE 返回非 0，整个管道因此判负、
          # 断言在资源其实已内嵌时误报失败（曾连续三次云构建卡在此处）。
          STRINGS_TMP=$(mktemp)
          strings -a "$APP_DIR/$EXEC_NAME" > "$STRINGS_TMP" || true
          if grep -q "assets/index-" "$STRINGS_TMP"; then
            echo "custom-protocol 校验通过：已内嵌前端资源（$(grep -c "index.html" "$STRINGS_TMP") 处 index.html 引用）"
          else
            echo "::error::可执行文件未内嵌前端资源，custom-protocol 未生效（装到真机会闪退）"
            echo "--- 诊断：.app 内容 ---"; ls -la "$APP_DIR" | head -20
            echo "--- 诊断：index.html 出现次数 ---"; grep -c "index.html" "$STRINGS_TMP" || true
            echo "--- 诊断：devUrl 常量 ---"; grep -o "http://localhost:[0-9]*" "$STRINGS_TMP" | head -3 || true
            rm -f "$STRINGS_TMP"
            exit 1
          fi
          rm -f "$STRINGS_TMP"

          cd build
          zip -qry orbis-ios-user-unsigned.ipa Payload
          # 防回归：确认 ipa 内图标确为项目 logo 而非 Tauri 默认图标。
          # .app 内的 AppIcon*.png 是 iOS 专用 CgBI 变体，直接比字节会不等，
          # 故用 sips 归一化为标准 PNG 后比对像素内容。
          test -f Payload/*.app/Assets.car || { echo "::error::.app 内缺少 Assets.car，图标未编入"; exit 1; }
          ICON_IN_APP=$(find Payload -name "AppIcon-76x76@2x.png" -o -name "AppIcon76x76@2x~ipad.png" | head -1)
          test -n "$ICON_IN_APP" || { echo "::error::.app 内未找到 iPad 图标资源"; exit 1; }
          ICON_SRC=$(find ../src-tauri/icons/ios -name "AppIcon-76x76@2x.png" | head -1)
          sips -s format png "$ICON_IN_APP" --out /tmp/icon-in-app.png >/dev/null 2>&1
          sips -s format png "$ICON_SRC" --out /tmp/icon-src.png >/dev/null 2>&1
          SHA_IN_APP=$(shasum -a 256 /tmp/icon-in-app.png | awk '{print $1}')
          SHA_SRC=$(shasum -a 256 /tmp/icon-src.png | awk '{print $1}')
          if [ "$SHA_IN_APP" != "$SHA_SRC" ]; then
            echo "::error::ipa 内图标与 src-tauri/icons/ios/ 不一致，桌面图标会是 Tauri 默认图标"
            echo "  包内: $SHA_IN_APP ($ICON_IN_APP)"
            echo "  源图: $SHA_SRC ($ICON_SRC)"
            exit 1
          fi
          echo "图标校验通过：ipa 内图标与项目源图一致（$ICON_SRC）"
          kill $SERVER_PID || true

      - name: 上传未签名 ipa
        uses: actions/upload-artifact@v4
        with:
          name: orbis-ios-user-unsigned
          path: build/orbis-ios-user-unsigned.ipa
