# Orbis iOS 用户端云端构建（未签名 ipa，供爱思助手等工具用个人 Apple ID 签名后侧载）。
# 本机无完整 Xcode，iOS 构建依赖 runner 自带的 Xcode/iOS SDK；禁用代码签名，
# 从 xcarchive 取出 .app 打包为 Payload/*.ipa。
# 注意：不构建管理员版——签发私钥材料（keys/）永不进入任何远端。
# 私有语料：构建前从 orbis-lore 还原断法/案例正文与加密案例包，见「还原私有语料」步骤。
# 触发：手动运行，或推送 v* 标签发布时；不随普通提交构建。
name: ios-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust（iOS target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      # 断法正文（import.meta.glob 内联进前端）与完整案例库（build.rs 嵌入加密包）
      # 都来自 gitignored 的私有语料，构建前必须从 orbis-lore 还原，否则产物内容为空
      #（v2.1.0 云端正式包正是因缺这一步而丢失断法与完整案例）。
      # 凭据：ORBIS_LORE_DEPLOY_KEY = orbis-lore 只读部署密钥，私钥仅存于本仓库 Secrets。
      - name: 检查语料仓凭据
        shell: bash
        env:
          ORBIS_LORE_DEPLOY_KEY: ${{ secrets.ORBIS_LORE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$ORBIS_LORE_DEPLOY_KEY" || { echo "::error::缺少 Secret ORBIS_LORE_DEPLOY_KEY（orbis-lore 只读部署密钥），本次构建拒绝继续以免产出空内容包"; exit 1; }

      - name: 检出私有语料仓 orbis-lore
        uses: actions/checkout@v4
        with:
          repository: xiongaox/orbis-lore
          ssh-key: ${{ secrets.ORBIS_LORE_DEPLOY_KEY }}
          path: orbis-lore
          persist-credentials: false

      - name: 还原私有语料
        shell: bash
        run: |
          set -euo pipefail
          cp -R orbis-lore/corpus/. src/data/cases/
          mkdir -p dist-cases
          cp orbis-lore/dist/cases_v1.enc dist-cases/
          echo "语料还原完成：$(find src/data/cases -name '*.md' | wc -l) 个 md，案例加密包 $(wc -c < dist-cases/cases_v1.enc) 字节"

      - name: 生成 iOS 工程
        run: |
          brew install xcodegen
          npx tauri ios init

      - name: 构建前端产物
        run: npm run build

      - name: 归档（禁用代码签名）并打包未签名 ipa
        env:
          # xcodebuild 的 Run Script 阶段会调用 cargo，需要能找到它
          PATH: /Users/runner/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          DEVELOPER_DIR: /Applications/Xcode_16.4.app
        run: |
          set -euxo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            DEVELOPER_DIR=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
            export DEVELOPER_DIR
          fi
          echo "使用 Xcode：$DEVELOPER_DIR"
          XCPROJ=$(find src-tauri/gen/apple -maxdepth 1 -name "*.xcodeproj" | head -1)
          echo "Xcode 工程：$XCPROJ"
          # 本项目 iOS 无任何 pod 依赖：跳过 pod install，避免空的 Pods 集成
          # 注入 libPods-app_iOS 链接引用后反而导致链接失败
          echo "pbxproj 中的 Pods 引用："
          (grep -c "Pods" "$XCPROJ/project.pbxproj" || true)
          # xcode-script 阶段要从 {identifier}-server-addr 读取选项通道，手动 xcodebuild
          # 没有官方 build 前置流程写入该文件，这里伪造一个选项服务使脚本阶段可用
          python3 -m venv /tmp/ws-venv
          /tmp/ws-venv/bin/pip install websockets --quiet
          /tmp/ws-venv/bin/python scripts/fake-tauri-ios-server.py &
          SERVER_PID=$!
          sleep 2
          printf '127.0.0.1:9876' > "$TMPDIR/com.orbis.app-server-addr"
          SCHEME=$(xcodebuild -list -project "$XCPROJ" | awk '/Schemes:/{flag=1; next} flag && NF {print; exit}' | xargs)
          echo "构建 scheme：$SCHEME"
          find "$XCPROJ/xcshareddata/xcschemes" -name "*.xcscheme" -exec sed -i '' 's/buildConfiguration="Debug"/buildConfiguration="Release"/g' {} +
          xcodebuild -project "$XCPROJ" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/orbis.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          mkdir -p build/Payload
          APP=$(find build/orbis.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          cp -R "$APP" build/Payload/
          cd build
          zip -qry orbis-ios-user-unsigned.ipa Payload
          kill $SERVER_PID || true

      - name: 上传未签名 ipa
        uses: actions/upload-artifact@v4
        with:
          name: orbis-ios-user-unsigned
          path: build/orbis-ios-user-unsigned.ipa
