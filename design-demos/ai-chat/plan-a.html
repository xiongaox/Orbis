<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 A · 纯净会话流</title>
<link rel="stylesheet" href="shared.css?v=3">
<style>
/* 方案 A：ChatGPT/Claude 式——配置全部退场，一屏只有对象、会话、输入 */
.ctx-line {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 7px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--border-soft);
  font-size: 11px; color: var(--muted);
}
.ctx-line .obj { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 30px; text-align: center; gap: 12px;
}
.empty .ico {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--primary-soft);
  display: flex; align-items: center; justify-content: center;
  color: var(--primary);
}
.empty h4 { font-size: 15px; font-weight: 600; }
.empty p { font-size: 11.5px; color: var(--muted); line-height: 1.7; max-width: 280px; }
.empty .sugg { margin-top: 6px; }
.cta-outline {
  margin-top: 4px;
  height: 38px; padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--primary-border);
  background: transparent;
  color: var(--primary);
  font-size: 12.5px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  cursor: pointer;
}
.cta-outline:active { background: var(--primary-soft); }
.inputbar { padding: 8px 12px 14px; }
.ib-main {
  display: flex; align-items: flex-end; gap: 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  padding: 8px 8px 8px 12px;
  transition: border-color .15s;
}
.ib-main:focus-within { border-color: var(--primary-border); }
.ib-main textarea { min-height: 20px; max-height: 96px; flex: 1; }
.ib-meta {
  display: flex; align-items: center; gap: 5px;
  margin-top: 6px; padding: 0 3px;
}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:48</span><span class="sb-icons"><span class="sb-dot on"></span><span class="sb-dot on"></span><span class="sb-dot"></span></span></div>

  <div class="page">
    <div class="phead">
      <button class="back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1>八字 AI 研判助手</h1>
      <div class="hacts">
        <button class="hbtn" title="会话历史">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          <span class="cnt">3</span>
        </button>
        <button class="hbtn" title="AI 服务设置">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <!-- 上下文一行：仅对象与模式，服务/模型退到输入区摘要 -->
    <div class="ctx-line">
      研判对象：<span class="obj">2026-09-29 排盘</span>
      <span class="badge">多轮对话</span>
      <span class="caption mono" style="margin-left:auto">0 条</span>
    </div>

    <!-- 空态 = 建议 -->
    <div class="chat" id="chat">
      <div class="empty" id="empty">
        <div class="ico">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
        </div>
        <h4>开启深度命理研判</h4>
        <p>AI 将结合当前排盘推演。可以从下面的问题开始：</p>
        <div class="sugg">
          <button onclick="ask('详断事业与职场贵人')">详断事业与职场贵人</button>
          <button onclick="ask('详评正偏财运走向')">详评正偏财运走向</button>
          <button onclick="ask('婚恋感情应期分析')">婚恋感情应期分析</button>
          <button onclick="ask('今年流年吉凶要点')">今年流年吉凶要点</button>
        </div>
        <button class="cta-outline" onclick="ask('发送当前排盘发起初审')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
          发送当前排盘发起初审
        </button>
      </div>
    </div>

    <!-- 输入区：单栏，服务/模型摘要做成可点小字 -->
    <div class="inputwrap">
      <div class="ib-main">
        <textarea class="chat-input" rows="1" placeholder="询问关于本命盘的任何问题…"></textarea>
        <button class="icon-ghost" onclick="askSend()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
      <div class="ib-meta">
        <span class="caption">已关联当前排盘上下文</span>
        <span class="caption mono" style="margin-left:auto; color:var(--primary)" onclick="alert('demo：跳转 AI 服务设置页')">yjs · deepseek-v4 ⌄</span>
      </div>
    </div>
  </div>
</div>

<script>
const AI_REPLY = '以丙火日主生于酉月取正财格而论：\n\n<span class="sec">事业层面</span>，当前大运财星透干而比劫有制，宜以专业能力立身、借团队之势进取，职场贵人应在中年大运的印星阶段。\n\n<span class="sec">财运层面</span>，2026 丙午流年比肩夺财之象明显，重大投入宜在上半年落实，忌与友人合伙涉险。';
let count = 0;

function ask(text) { send(text); }
function askSend() { send('详断事业与职场贵人'); }

function send(text) {
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  const chat = document.getElementById('chat');
  chat.insertAdjacentHTML('beforeend', `
    <div class="msg user">
      <span class="meta">我</span>
      <div class="bubble">${text}</div>
    </div>
    <div class="msg ai" id="typingMsg">
      <span class="meta">八字 AI 助手</span>
      <div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>
    </div>`);
  chat.scrollTop = chat.scrollHeight;
  setTimeout(() => {
    document.getElementById('typingMsg').querySelector('.bubble').innerHTML = AI_REPLY.replace(/\n/g, '<br>');
    count += 1;
    document.querySelector('.ctx-line .caption').textContent = count + ' 条';
    chat.scrollTop = chat.scrollHeight;
  }, 900);
}
</script>
</body>
</html>
