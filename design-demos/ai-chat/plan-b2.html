<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 · 一行摘要卡（默认收起）</title>
<link rel="stylesheet" href="shared.css?v=3">
<style>
/* B2：与 B 同一张卡，但默认收成一行摘要，展开才是完整换挡面板——空间最省 */
.ctx-card {
  flex-shrink: 0;
  margin: 10px 12px 0;
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  background: var(--surface);
  overflow: hidden;
}
.ctx-row1 {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 12px;
  cursor: pointer;
}
.ctx-row1 .obj { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx-row1 .sum { font-size: 10.5px; color: var(--muted); }
.ctx-row1 .chev { color: var(--muted); transition: transform .2s; flex-shrink: 0; }
.ctx-card.open .ctx-row1 .chev { transform: rotate(180deg); }
.ctx-more { display: none; padding: 0 12px 11px; }
.ctx-card.open .ctx-more { display: block; }
.ctx-more .row2 { display: flex; align-items: center; gap: 7px; padding-top: 9px; border-top: 1px solid var(--border-soft); }
.ctx-more .hacts { margin-left: auto; display: flex; gap: 6px; }
.mini-btn {
  width: 30px; height: 30px;
  border: 1px solid var(--border-soft);
  background: transparent;
  color: var(--muted);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.mini-btn:active { background: var(--surface-2); color: var(--text); }
.mini-btn .cnt {
  position: absolute; transform: translate(11px, -11px);
  min-width: 14px; height: 14px; padding: 0 3px;
  border-radius: 7px;
  background: var(--primary); color: var(--primary-fg);
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

.empty {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 30px; text-align: center; gap: 12px;
}
.empty h4 { font-size: 15px; font-weight: 600; }
.empty p { font-size: 11.5px; color: var(--muted); line-height: 1.7; max-width: 280px; }
.cta {
  height: 40px; padding: 0 18px;
  border: none; border-radius: 10px;
  background: var(--primary); color: var(--primary-fg);
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  cursor: pointer;
}
.cta:active { background: var(--primary-press); }
.inputbar { padding: 8px 12px 12px; }
.ib-box {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  padding: 8px 10px;
}
.ib-box:focus-within { border-color: var(--primary-border); }
.ib-box textarea { min-height: 34px; max-height: 96px; }
.ib-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 7px; border-top: 1px solid var(--border-soft); margin-top: 6px; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:48</span><span class="sb-icons"><span class="sb-dot on"></span><span class="sb-dot on"></span><span class="sb-dot"></span></span></div>

  <div class="page">
    <div class="phead">
      <button class="back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1>八字 AI 研判助手</h1>
      <div class="hacts">
        <button class="hbtn" title="AI 服务设置">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg>
        </button>
      </div>
    </div>

    <!-- 摘要卡：默认一行，点开完整面板 -->
    <div class="ctx-card" id="ctxCard">
      <div class="ctx-row1" onclick="toggleCtx()">
        <span class="obj">2026-09-29 排盘</span>
        <span class="badge">多轮对话</span>
        <span class="sum mono" id="ctxSum">yjs · deepseek-v4</span>
        <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="ctx-more">
        <div class="row2">
          <button class="dd" onclick="event.stopPropagation()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            服务: <b>yjs</b>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button class="dd" onclick="event.stopPropagation()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
            模型: <b>deepseek-v4-fl…</b>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="hacts">
            <button class="mini-btn" style="position:relative" title="会话历史">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
              <span class="cnt">3</span>
            </button>
            <button class="mini-btn" title="AI 角色">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 空态 -->
    <div class="chat" id="chat">
      <div class="empty" id="empty">
        <h4>开启深度命理研判</h4>
        <p>输入您想要了解的问题，AI 将结合当前排盘推演。</p>
        <div class="sugg">
          <button onclick="ask('详断事业与职场贵人')">详断事业与职场贵人</button>
          <button onclick="ask('详评正偏财运走向')">详评正偏财运走向</button>
          <button onclick="ask('婚恋感情应期分析')">婚恋感情应期分析</button>
        </div>
        <button class="cta" onclick="ask('发送当前排盘发起初审')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
          发送当前排盘发起初审
        </button>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="inputbar">
      <div class="ib-box">
        <textarea class="chat-input" rows="2" placeholder="询问关于本命盘的任何问题…"></textarea>
        <div class="ib-foot">
          <span class="caption">已关联当前排盘上下文</span>
          <button class="send-btn" style="height:32px; padding:0 14px" onclick="askSend()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
            发送
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const AI_REPLY = '以丙火日主生于酉月取正财格而论：\n\n<span class="sec">事业层面</span>，当前大运财星透干而比劫有制，宜以专业能力立身、借团队之势进取。\n\n<span class="sec">财运层面</span>，2026 丙午流年比肩夺财之象明显，重大投入宜在上半年落实。';
let count = 0;

function toggleCtx() { document.getElementById('ctxCard').classList.toggle('open'); }
function ask(text) { send(text); }
function askSend() { send('详断事业与职场贵人'); }

function send(text) {
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  const chat = document.getElementById('chat');
  chat.insertAdjacentHTML('beforeend', `
    <div class="msg user">
      <span class="meta">我</span>
      <div class="bubble">${text}</div>
    </div>
    <div class="msg ai" id="typingMsg">
      <span class="meta">八字 AI 助手</span>
      <div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>
    </div>`);
  chat.scrollTop = chat.scrollHeight;
  setTimeout(() => {
    document.getElementById('typingMsg').querySelector('.bubble').innerHTML = AI_REPLY.replace(/\n/g, '<br>');
    count += 1;
    document.getElementById('ctxSum').textContent = `yjs · deepseek-v4 · ${count} 条`;
    chat.scrollTop = chat.scrollHeight;
  }, 900);
}
</script>
</body>
</html>
