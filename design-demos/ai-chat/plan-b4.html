<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B4 · 底部换挡条</title>
<link rel="stylesheet" href="shared.css?v=3">
<style>
/* B4：上下文移到输入区上方——拇指够得着的换挡，消息区最大化 */
.empty {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 30px; text-align: center; gap: 12px;
}
.empty h4 { font-size: 15px; font-weight: 600; }
.empty p { font-size: 11.5px; color: var(--muted); line-height: 1.7; max-width: 280px; }
.cta {
  height: 40px; padding: 0 18px;
  border: none; border-radius: 10px;
  background: var(--primary); color: var(--primary-fg);
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  cursor: pointer;
}
.cta:active { background: var(--primary-press); }

/* 底部换挡条：对象 + 服务/模型 chips，点击弹底部选择板 */
.ctxbar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  border-top: 1px solid var(--border-soft);
  background: var(--bg);
  overflow-x: auto;
}
.ctxbar .obj-chip {
  display: flex; align-items: center; gap: 5px;
  height: 28px; padding: 0 9px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  font-size: 10.5px; color: var(--muted);
  white-space: nowrap; flex-shrink: 0;
}
.ctxbar .obj-chip b { color: var(--text); font-weight: 600; }
.ctxbar .dd { height: 28px; font-size: 11px; }
.ctxbar .dd b { max-width: 92px; }

/* 底部选择板 */
.mask {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.55);
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
  z-index: 40;
}
.mask.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: #1b1c1e;
  border-radius: 16px 16px 0 0;
  border-top: 1px solid var(--border);
  transform: translateY(102%);
  transition: transform .3s cubic-bezier(.32, .72, .28, 1);
  z-index: 45;
  padding-bottom: 16px;
}
.sheet.show { transform: none; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: #3a3b3e; margin: 10px auto 0; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 8px 18px 4px; font-size: 14px; font-weight: 700; }
.sheet-h .x { width: 30px; height: 30px; border: none; background: transparent; color: var(--muted); font-size: 17px; cursor: pointer; }
.opts { padding: 6px 18px 4px; display: flex; flex-direction: column; }
.opt-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 2px;
  font-size: 13.5px; color: var(--text);
  cursor: pointer;
  border-bottom: 1px solid var(--border-soft);
}
.opt-row:last-child { border-bottom: none; }
.opt-row .tick { color: var(--primary); opacity: 0; }
.opt-row.on .tick { opacity: 1; }
.opt-row .d { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

.inputbar { padding: 8px 12px 12px; }
.ib-box {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  padding: 8px 10px;
}
.ib-box:focus-within { border-color: var(--primary-border); }
.ib-box textarea { min-height: 34px; max-height: 96px; }
.ib-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 7px; border-top: 1px solid var(--border-soft); margin-top: 6px; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:48</span><span class="sb-icons"><span class="sb-dot on"></span><span class="sb-dot on"></span><span class="sb-dot"></span></span></div>

  <div class="page">
    <div class="phead">
      <button class="back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1>八字 AI 研判助手</h1>
      <div class="hacts">
        <button class="hbtn" title="会话历史">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          <span class="cnt">3</span>
        </button>
        <button class="hbtn" title="AI 角色">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg>
        </button>
        <button class="hbtn" title="AI 服务设置">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg>
        </button>
      </div>
    </div>

    <!-- 空态：历史入口全在页头，消息区从空态直接开始 -->
    <div class="chat" id="chat">
      <div class="empty" id="empty">
        <h4>开启深度命理研判</h4>
        <p>输入您想要了解的问题，AI 将结合当前排盘推演。</p>
        <div class="sugg">
          <button onclick="ask('详断事业与职场贵人')">详断事业与职场贵人</button>
          <button onclick="ask('详评正偏财运走向')">详评正偏财运走向</button>
          <button onclick="ask('婚恋感情应期分析')">婚恋感情应期分析</button>
        </div>
        <button class="cta" onclick="ask('发送当前排盘发起初审')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
          发送当前排盘发起初审
        </button>
      </div>
    </div>

    <!-- 底部换挡条：拇指可达，点 chips 弹选择板 -->
    <div class="ctxbar">
      <span class="obj-chip">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <b>2026-09-29 排盘</b>
      </span>
      <button class="dd" onclick="openSheet('svc')">
        服务: <b id="svcChip">yjs</b>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="dd" onclick="openSheet('mdl')">
        模型: <b id="mdlChip">deepseek-v4</b>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <!-- 输入区 -->
    <div class="inputbar">
      <div class="ib-box">
        <textarea class="chat-input" rows="2" placeholder="询问关于本命盘的任何问题…"></textarea>
        <div class="ib-foot">
          <span class="caption">已关联当前排盘上下文</span>
          <button class="send-btn" style="height:32px; padding:0 14px" onclick="askSend()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
            发送
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部选择板 -->
  <div class="mask" id="mask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="sheet-h"><span id="sheetTitle">选择服务</span><button class="x" onclick="closeSheet()">✕</button></div>
    <div class="opts" id="sheetOpts"></div>
  </div>

  <div class="toast" id="toast"><span id="toastMsg"></span></div>
</div>

<script>
const AI_REPLY = '以丙火日主生于酉月取正财格而论：\n\n<span class="sec">事业层面</span>，当前大运财星透干而比劫有制，宜以专业能力立身、借团队之势进取。\n\n<span class="sec">财运层面</span>，2026 丙午流年比肩夺财之象明显，重大投入宜在上半年落实。';
const SVC_LIST = [
  { id: 'yjs', name: 'yjs', desc: '当前已连接' },
  { id: 'relay', name: '中转直连', desc: 'OpenAI 兼容接口' },
  { id: 'local', name: '本地代理', desc: '127.0.0.1:8080' },
];
const MDL_LIST = [
  { id: 'ds', name: 'deepseek-v4-flash', desc: 'yjs 服务' },
  { id: 'glm', name: 'glm-5', desc: 'yjs 服务' },
  { id: 'kimi', name: 'kimi-k3', desc: '中转直连' },
];
let count = 0;
let sheetMode = 'svc';

function openSheet(mode) {
  sheetMode = mode;
  const list = mode === 'svc' ? SVC_LIST : MDL_LIST;
  const current = mode === 'svc' ? document.getElementById('svcChip').textContent : document.getElementById('mdlChip').textContent;
  document.getElementById('sheetTitle').textContent = mode === 'svc' ? '选择服务' : '选择模型';
  document.getElementById('sheetOpts').innerHTML = list.map(o => `
    <div class="opt-row ${o.name === current ? 'on' : ''}" onclick="pick('${mode}', '${o.name}')">
      <div><div>${o.name}</div><div class="d">${o.desc}</div></div>
      <svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>
    </div>`).join('');
  document.getElementById('mask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet() {
  document.getElementById('mask').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
function pick(mode, name) {
  if (mode === 'svc') document.getElementById('svcChip').textContent = name;
  else document.getElementById('mdlChip').textContent = name;
  closeSheet();
}
function ask(text) { send(text); }
function askSend() { send('详断事业与职场贵人'); }

function send(text) {
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  const chat = document.getElementById('chat');
  chat.insertAdjacentHTML('beforeend', `
    <div class="msg user">
      <span class="meta">我</span>
      <div class="bubble">${text}</div>
    </div>
    <div class="msg ai" id="typingMsg">
      <span class="meta">八字 AI 助手</span>
      <div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>
    </div>`);
  chat.scrollTop = chat.scrollHeight;
  setTimeout(() => {
    document.getElementById('typingMsg').querySelector('.bubble').innerHTML = AI_REPLY.replace(/\n/g, '<br>');
    chat.scrollTop = chat.scrollHeight;
  }, 900);
}
</script>
</body>
</html>
