<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 C · 分段收紧（现状整理）</title>
<link rel="stylesheet" href="shared.css">
<style>
/* 方案 C：保留现有两段工具条结构，但全面收紧间距与字级，空态减负 */
.toolbar { flex-shrink: 0; border-bottom: 1px solid var(--border-soft); background: var(--surface); }
.tb-row1 {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 12px;
  font-size: 11px; color: var(--muted);
}
.tb-row1 .obj { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-row1 .hacts { margin-left: auto; display: flex; gap: 5px; }
.tb-row2 {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 12px 9px;
  border-top: 1px solid var(--border-soft);
}
.tb-row2 .count { margin-left: auto; font-size: 10.5px; color: var(--muted); }

.empty {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 30px; text-align: center; gap: 11px;
}
.empty h4 { font-size: 14.5px; font-weight: 600; }
.empty p { font-size: 11px; color: var(--muted); line-height: 1.7; max-width: 270px; }
.cta-slim {
  height: 34px; padding: 0 14px;
  border-radius: 9px;
  border: 1px solid var(--primary-border);
  background: var(--primary-soft);
  color: var(--primary);
  font-size: 12px; font-weight: 600;
  display: flex; align-items: center; gap: 5px;
  cursor: pointer;
}
.cta-slim:active { background: rgba(203,174,136,.22); }
.quickbar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border-top: 1px solid var(--border-soft);
  overflow-x: auto;
  background: var(--bg);
}
.quickbar .lbl { font-size: 10.5px; color: var(--muted); flex-shrink: 0; }
.quickbar button {
  font-size: 11px; padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}
.quickbar button:active { background: var(--surface-2); }
.inputbar { padding: 8px 12px 10px; }
.ib-box {
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--panel);
  padding: 7px 10px;
}
.ib-box:focus-within { border-color: var(--primary-border); }
.ib-box textarea { min-height: 30px; max-height: 96px; }
.ib-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 6px; border-top: 1px solid var(--border-soft); margin-top: 5px; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:48</span><span class="sb-icons"><span class="sb-dot on"></span><span class="sb-dot on"></span><span class="sb-dot"></span></span></div>

  <div class="page">
    <div class="phead">
      <button class="back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1>八字 AI 研判助手</h1>
    </div>

    <!-- 工具条两行收紧 -->
    <div class="toolbar">
      <div class="tb-row1">
        <span>研判对象：</span><span class="obj">2026-09-29 排盘</span>
        <span class="badge">多轮对话</span>
        <div class="hacts">
          <button class="hbtn" style="width:28px;height:28px" title="会话历史">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          </button>
          <button class="hbtn" style="width:28px;height:28px" title="AI 角色">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg>
          </button>
          <button class="hbtn" style="width:28px;height:28px" title="设置">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg>
          </button>
        </div>
      </div>
      <div class="tb-row2">
        <button class="dd" style="height:28px">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          服务: <b>yjs</b>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <button class="dd" style="height:28px">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
          模型: <b>deepseek-v4-fl…</b>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <span class="count mono">0 条对话</span>
      </div>
    </div>

    <!-- 空态：去掉大图标 -->
    <div class="chat" id="chat">
      <div class="empty" id="empty">
        <h4>开启深度命理研判</h4>
        <p>输入您想要了解的问题（如性格特质、财官格局、吉凶应对），AI 将结合当前排盘进行论证。</p>
        <button class="cta-slim" onclick="ask('发送当前排盘发起初审')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
          发送当前排盘发起初审
        </button>
      </div>
    </div>

    <!-- 快捷追问横滑条（保留） -->
    <div class="quickbar">
      <span class="lbl">✦ 快捷追问:</span>
      <button onclick="ask('当前局势吉凶评判')">当前局势吉凶评判</button>
      <button onclick="ask('事业与求财策略')">事业与求财策略</button>
      <button onclick="ask('克应玄机与行动建议')">克应玄机与行动建议</button>
    </div>

    <!-- 输入区 -->
    <div class="inputbar">
      <div class="ib-box">
        <textarea class="chat-input" rows="2" placeholder="询问关于本命盘的任何问题…"></textarea>
        <div class="ib-foot">
          <span class="caption">已关联当前排盘上下文</span>
          <button class="send-btn" style="height:32px; padding:0 14px" onclick="askSend()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
            发送
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const AI_REPLY = '以丙火日主生于酉月取正财格而论：\n\n<span class="sec">事业层面</span>，当前大运财星透干而比劫有制，宜以专业能力立身、借团队之势进取。\n\n<span class="sec">财运层面</span>，2026 丙午流年比肩夺财之象明显，重大投入宜在上半年落实。';
let count = 0;

function ask(text) { send(text); }
function askSend() { send('当前局势吉凶评判'); }

function send(text) {
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  document.querySelector('.quickbar').style.display = 'none'; // 对话开始后让位给消息流
  const chat = document.getElementById('chat');
  chat.insertAdjacentHTML('beforeend', `
    <div class="msg user">
      <span class="meta">我</span>
      <div class="bubble">${text}</div>
    </div>
    <div class="msg ai" id="typingMsg">
      <span class="meta">八字 AI 助手</span>
      <div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>
    </div>`);
  chat.scrollTop = chat.scrollHeight;
  setTimeout(() => {
    document.getElementById('typingMsg').querySelector('.bubble').innerHTML = AI_REPLY.replace(/\n/g, '<br>');
    count += 1;
    document.querySelector('.tb-row2 .count').textContent = count + ' 条对话';
    chat.scrollTop = chat.scrollHeight;
  }, 900);
}
</script>
</body>
</html>
