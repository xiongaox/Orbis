<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 A2 · 实底键帽精修</title>
<link rel="stylesheet" href="shared.css">
<style>
/* A2 = 方案 A 一比一精修：去掉左侧「阳支/阴支」标签，键位满宽；
   配对规则由可选组正常 / 禁用组压暗 + 状态行「取阳支」一句话外显 */
.a2-pillars { display: flex; gap: 8px; padding: 14px 14px 8px; }
.a2-col {
  flex: 1;
  background: linear-gradient(180deg, #1d1e20, #191a1c);
  border: 1px solid #2b2c2f;
  border-radius: 13px;
  padding: 7px 6px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.a2-col-name { font-size: 11px; color: var(--muted); letter-spacing: .14em; }
.a2-cell {
  width: 100%; height: 52px;
  border-radius: 9px;
  background: #131415;
  display: flex; align-items: center; justify-content: center;
  font-size: 23px; font-weight: 600;
  cursor: pointer;
  transition: background .18s, box-shadow .18s;
}
.a2-cell.on { background: var(--primary-soft); animation: breathe 1.6s ease-in-out infinite; }

.a2-dots { display: flex; gap: 12px; justify-content: center; padding: 2px 0 9px; }
.a2-dotgrp { display: flex; gap: 4px; }
.a2-dot { width: 6px; height: 6px; border-radius: 50%; background: #2c2d30; transition: background .2s; }
.a2-dot.done { background: var(--primary); }
.a2-dot.cur { background: transparent; box-shadow: inset 0 0 0 1.5px var(--primary); animation: dotpulse 1.4s ease-in-out infinite; }
@keyframes dotpulse { 0%,100% { box-shadow: inset 0 0 0 1.5px var(--primary); } 50% { box-shadow: inset 0 0 0 1.5px rgba(203,174,136,.35); } }

.a2-status {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 16px 10px;
  font-size: 11.5px; color: var(--muted);
}
.a2-status .hint b { color: var(--primary); font-weight: 600; }

.a2-kbd .key { background: #232427; border: 1px solid #2d2e31; box-shadow: 0 1px 0 rgba(0,0,0,.22); }
.a2-kbd .key:active { background: #2b2c2f; }
.a2-kbd .key.dis { opacity: .15; }

.a2-actions { display: flex; gap: 10px; padding: 2px 14px 14px; }
.a2-clear {
  height: 44px; padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--border-soft);
  color: var(--muted); font-size: 13px;
}
.a2-clear:active { background: rgba(255,255,255,.05); }
.a2-reverse {
  flex: 1; height: 44px;
  border-radius: 10px;
  background: var(--primary-soft);
  color: var(--primary);
  font-size: 14px; font-weight: 600;
  transition: background .2s, color .2s;
}
.a2-reverse.ready { background: var(--primary); color: var(--primary-fg); }
.a2-reverse:active { transform: scale(.985); }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>11:55</span><span class="sb-icons"><i class="sb-dot on"></i><i class="sb-dot on"></i><i class="sb-dot"></i></span></div>
  <div class="page">
    <div class="phead"><button class="back">‹</button>新建案例</div>
    <div class="ghostform">
      <div class="gf lab"></div><div class="gf inp"></div>
      <div class="gf lab"></div><div class="gf inp"></div>
      <div class="gf lab"></div><div class="gf row"></div>
    </div>
  </div>
  <div class="overlay"></div>
  <div class="sheet-wrap">
    <div class="sheet">
      <div class="sheet-head">
        <button class="sh-cancel">取消</button>
        <div class="tabs"><span class="tab">公历</span><span class="tab">农历</span><span class="tab on">四柱</span></div>
        <button class="sh-ok">确定</button>
      </div>

      <div class="a2-pillars" id="pillars"></div>
      <div class="a2-dots" id="dots"></div>
      <div class="a2-status">
        <span class="hint" id="hint"></span>
        <span>范围 1900–2100</span>
      </div>

      <div class="kbd a2-kbd" id="kbd"></div>

      <div class="results" id="results" hidden>
        <div class="res-cap"><b>找到 2 个匹配日期</b><button id="res-back">返回修改</button></div>
        <div class="res-item" data-d="1984-03-05 07:20"><span class="mono">1984-03-05 07:20</span><span class="tag">甲子年 · 丙寅月</span></div>
        <div class="res-item" data-d="2044-03-20 07:20"><span class="mono">2044-03-20 07:20</span><span class="tag">甲子年 · 丙寅月</span></div>
      </div>

      <div class="a2-actions">
        <button class="a2-clear" id="clear">清除</button>
        <button class="a2-reverse" id="reverse">反查日期</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"><span></span></div>
</div>

<script>
const STEMS = '甲乙丙丁戊己庚辛壬癸'.split('');
const YANG_B = ['子','寅','辰','午','申','戌'], YIN_B = ['丑','卯','巳','未','酉','亥'];
const EL = { '甲':'e-wood','乙':'e-wood','丙':'e-fire','丁':'e-fire','戊':'e-earth','己':'e-earth','庚':'e-metal','辛':'e-metal','壬':'e-water','癸':'e-water','子':'e-water','丑':'e-earth','寅':'e-wood','卯':'e-wood','辰':'e-earth','巳':'e-fire','午':'e-fire','未':'e-earth','申':'e-metal','酉':'e-metal','戌':'e-earth','亥':'e-water' };
const PILLAR = ['年','月','日','时'];

let slots = ['甲','子','丙','寅',null,null,null,null];
let active = 4;
let toastTimer;

const $ = s => document.querySelector(s);
const full = () => slots.every(Boolean);

function toast(msg) {
  const t = $('#toast');
  t.querySelector('span').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

const pillarsEl = $('#pillars');
pillarsEl.innerHTML = PILLAR.map((n, c) => `
  <div class="a2-col">
    <div class="a2-col-name">${n}</div>
    <div class="a2-cell serif" data-i="${c*2}"></div>
    <div class="a2-cell serif" data-i="${c*2+1}"></div>
  </div>`).join('');
$('#dots').innerHTML = PILLAR.map((n, c) =>
  `<div class="a2-dotgrp">${[0,1].map(k => `<div class="a2-dot" data-i="${c*2+k}"></div>`).join('')}</div>`).join('');

const cells = [...pillarsEl.querySelectorAll('.a2-cell')];
const dots = [...$('#dots').querySelectorAll('.a2-dot')];

cells.forEach(c => c.addEventListener('click', () => {
  const i = +c.dataset.i;
  active = slots[i] ? (i % 2 === 0 ? i : i - 1) : i;
  render();
}));

// 从 from 起找下一个空位，找不到则回绕，全满返回 null
function nextSlot(from) {
  for (let i = from; i < 8; i++) if (!slots[i]) return i;
  for (let i = 0; i < 8; i++) if (!slots[i]) return i;
  return null;
}

function keyRow(chars, enabled) {
  const keys = chars.map(c => `<div class="key serif ${EL[c]}${enabled ? '' : ' dis'}" data-k="${c}">${c}</div>`).join('');
  return `<div class="krow">${keys}</div>`;
}

function renderKbd() {
  const kbd = $('#kbd');
  if (active === null) {
    kbd.innerHTML = keyRow(STEMS.slice(0,5), false) + keyRow(STEMS.slice(5), false);
    return;
  }
  if (active % 2 === 0) {
    kbd.innerHTML = keyRow(STEMS.slice(0,5), true) + keyRow(STEMS.slice(5), true);
  } else {
    const yang = STEMS.indexOf(slots[active-1]) % 2 === 0;
    kbd.innerHTML = keyRow(YANG_B, yang) + keyRow(YIN_B, !yang);
  }
}

function render() {
  cells.forEach(c => {
    const i = +c.dataset.i, v = slots[i];
    c.textContent = v || '';
    c.className = 'a2-cell serif' + (v ? ' ' + EL[v] : '') + (i === active ? ' on' : '');
  });
  dots.forEach(d => {
    const i = +d.dataset.i;
    d.className = 'a2-dot' + (slots[i] ? ' done' : i === active ? ' cur' : '');
  });
  $('#hint').innerHTML = active === null
    ? '四柱已成，可<b>反查日期</b>'
    : active % 2 === 0
      ? `正在输入 · <b>${PILLAR[active>>1]}柱天干</b>`
      : `正在输入 · <b>${PILLAR[active>>1]}柱地支</b> · 取${STEMS.indexOf(slots[active-1]) % 2 === 0 ? '阳' : '阴'}支`;
  renderKbd();
  $('#reverse').classList.toggle('ready', full());
}

$('#kbd').addEventListener('click', e => {
  const k = e.target.closest('.key');
  if (!k) return;
  slots[active] = k.dataset.k;
  active = nextSlot(active + 1);
  render();
});

$('#clear').addEventListener('click', () => {
  slots = Array(8).fill(null);
  active = 0;
  $('#results').hidden = true;
  $('#kbd').hidden = false;
  render();
});

$('#reverse').addEventListener('click', () => {
  if (!full()) { toast('请先完整填写四柱'); return; }
  $('#kbd').hidden = true;
  $('#results').hidden = false;
});

$('#res-back').addEventListener('click', () => {
  $('#results').hidden = true;
  $('#kbd').hidden = false;
});

[...document.querySelectorAll('.res-item')].forEach(r => r.addEventListener('click', () => {
  toast(`已选定 ${r.dataset.d}，将切回公历页复核`);
  $('#results').hidden = true;
  $('#kbd').hidden = false;
  render();
}));

render();
</script>
</body>
</html>
