<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 A3 · 紧凑计算器</title>
<link rel="stylesheet" href="shared.css">
<style>
/* A3 = 方案 A 的紧凑高密度版：整体高度压缩约 1/4；
   去掉全局进度点（完成态由柱卡自表达），清除收进状态行，反查整宽；
   键帽密排无描边，无阴阳标签，禁用组压暗 */
.a3-pillars { display: flex; gap: 6px; padding: 12px 12px 6px; }
.a3-col {
  flex: 1;
  background: #1a1b1d;
  border: 1px solid #27282b;
  border-radius: 10px;
  padding: 6px 5px 7px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.a3-col.on {
  border-color: rgba(203,174,136,.4);
  box-shadow: 0 0 14px rgba(203,174,136,.08);
}
.a3-col-name { font-size: 10px; color: var(--muted); letter-spacing: .16em; }
.a3-cell {
  width: 100%; height: 44px;
  border-radius: 7px;
  background: #121314;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 600;
  cursor: pointer;
  transition: background .18s, box-shadow .18s;
}
.a3-cell.on { background: var(--primary-soft); animation: breathe 1.6s ease-in-out infinite; }

.a3-status {
  display: flex; justify-content: space-between; align-items: center;
  padding: 2px 14px 8px;
  font-size: 11px; color: var(--muted);
}
.a3-status .hint b { color: var(--primary); font-weight: 600; }
.a3-status .right { display: flex; align-items: center; gap: 8px; }
.a3-status .clear-btn { font-size: 11.5px; color: var(--muted); padding: 4px 9px; border-radius: 7px; }
.a3-status .clear-btn:active { background: rgba(255,255,255,.06); color: var(--text); }

.a3-kbd { padding: 2px 10px 6px; }
.a3-kbd .krow { gap: 5px; margin-bottom: 5px; }
.a3-kbd .key {
  height: 40px;
  border-radius: 6px;
  background: #1e1f22;
  font-size: 17px;
  box-shadow: none;
}
.a3-kbd .key:active { background: #28292d; }
.a3-kbd .key.dis { opacity: .16; }

.a3-actions { padding: 2px 12px 12px; }
.a3-reverse {
  width: 100%; height: 42px;
  border-radius: 9px;
  background: var(--primary-soft);
  color: var(--primary);
  font-size: 14px; font-weight: 600;
  transition: background .2s, color .2s;
}
.a3-reverse.ready { background: var(--primary); color: var(--primary-fg); }
.a3-reverse:active { transform: scale(.99); }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>11:55</span><span class="sb-icons"><i class="sb-dot on"></i><i class="sb-dot on"></i><i class="sb-dot"></i></span></div>
  <div class="page">
    <div class="phead"><button class="back">‹</button>新建案例</div>
    <div class="ghostform">
      <div class="gf lab"></div><div class="gf inp"></div>
      <div class="gf lab"></div><div class="gf inp"></div>
      <div class="gf lab"></div><div class="gf row"></div>
    </div>
  </div>
  <div class="overlay"></div>
  <div class="sheet-wrap">
    <div class="sheet">
      <div class="sheet-head">
        <button class="sh-cancel">取消</button>
        <div class="tabs"><span class="tab">公历</span><span class="tab">农历</span><span class="tab on">四柱</span></div>
        <button class="sh-ok">确定</button>
      </div>

      <div class="a3-pillars" id="pillars"></div>
      <div class="a3-status">
        <span class="hint" id="hint"></span>
        <span class="right">
          <span>范围 1900–2100</span>
          <button class="clear-btn" id="clear">清除</button>
        </span>
      </div>

      <div class="a3-kbd" id="kbd"></div>

      <div class="results" id="results" hidden>
        <div class="res-cap"><b>找到 2 个匹配日期</b><button id="res-back">返回修改</button></div>
        <div class="res-item" data-d="1984-03-05 07:20"><span class="mono">1984-03-05 07:20</span><span class="tag">甲子年 · 丙寅月</span></div>
        <div class="res-item" data-d="2044-03-20 07:20"><span class="mono">2044-03-20 07:20</span><span class="tag">甲子年 · 丙寅月</span></div>
      </div>

      <div class="a3-actions">
        <button class="a3-reverse" id="reverse">反查日期</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"><span></span></div>
</div>

<script>
const STEMS = '甲乙丙丁戊己庚辛壬癸'.split('');
const YANG_B = ['子','寅','辰','午','申','戌'], YIN_B = ['丑','卯','巳','未','酉','亥'];
const EL = { '甲':'e-wood','乙':'e-wood','丙':'e-fire','丁':'e-fire','戊':'e-earth','己':'e-earth','庚':'e-metal','辛':'e-metal','壬':'e-water','癸':'e-water','子':'e-water','丑':'e-earth','寅':'e-wood','卯':'e-wood','辰':'e-earth','巳':'e-fire','午':'e-fire','未':'e-earth','申':'e-metal','酉':'e-metal','戌':'e-earth','亥':'e-water' };
const PILLAR = ['年','月','日','时'];

let slots = ['甲','子','丙','寅',null,null,null,null];
let active = 4;
let toastTimer;

const $ = s => document.querySelector(s);
const full = () => slots.every(Boolean);

function toast(msg) {
  const t = $('#toast');
  t.querySelector('span').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

const pillarsEl = $('#pillars');
pillarsEl.innerHTML = PILLAR.map((n, c) => `
  <div class="a3-col" data-col="${c}">
    <div class="a3-col-name">${n}</div>
    <div class="a3-cell serif" data-i="${c*2}"></div>
    <div class="a3-cell serif" data-i="${c*2+1}"></div>
  </div>`).join('');

const cells = [...pillarsEl.querySelectorAll('.a3-cell')];
const cols = [...pillarsEl.querySelectorAll('.a3-col')];

cells.forEach(c => c.addEventListener('click', () => {
  const i = +c.dataset.i;
  active = slots[i] ? (i % 2 === 0 ? i : i - 1) : i;
  render();
}));

// 从 from 起找下一个空位，找不到则回绕，全满返回 null
function nextSlot(from) {
  for (let i = from; i < 8; i++) if (!slots[i]) return i;
  for (let i = 0; i < 8; i++) if (!slots[i]) return i;
  return null;
}

function keyRow(chars, enabled) {
  const keys = chars.map(c => `<div class="key serif ${EL[c]}${enabled ? '' : ' dis'}" data-k="${c}">${c}</div>`).join('');
  return `<div class="krow">${keys}</div>`;
}

function renderKbd() {
  const kbd = $('#kbd');
  if (active === null) {
    kbd.innerHTML = keyRow(STEMS.slice(0,5), false) + keyRow(STEMS.slice(5), false);
    return;
  }
  if (active % 2 === 0) {
    kbd.innerHTML = keyRow(STEMS.slice(0,5), true) + keyRow(STEMS.slice(5), true);
  } else {
    const yang = STEMS.indexOf(slots[active-1]) % 2 === 0;
    kbd.innerHTML = keyRow(YANG_B, yang) + keyRow(YIN_B, !yang);
  }
}

function render() {
  cells.forEach(c => {
    const i = +c.dataset.i, v = slots[i];
    c.textContent = v || '';
    c.className = 'a3-cell serif' + (v ? ' ' + EL[v] : '') + (i === active ? ' on' : '');
  });
  cols.forEach(col => {
    const c = +col.dataset.col;
    col.classList.toggle('on', active !== null && (active >> 1) === c);
  });
  $('#hint').innerHTML = active === null
    ? '四柱已成，可<b>反查日期</b>'
    : active % 2 === 0
      ? `正在输入 · <b>${PILLAR[active>>1]}柱天干</b>`
      : `正在输入 · <b>${PILLAR[active>>1]}柱地支</b> · 取${STEMS.indexOf(slots[active-1]) % 2 === 0 ? '阳' : '阴'}支`;
  renderKbd();
  $('#reverse').classList.toggle('ready', full());
}

$('#kbd').addEventListener('click', e => {
  const k = e.target.closest('.key');
  if (!k) return;
  slots[active] = k.dataset.k;
  active = nextSlot(active + 1);
  render();
});

$('#clear').addEventListener('click', () => {
  slots = Array(8).fill(null);
  active = 0;
  $('#results').hidden = true;
  $('#kbd').hidden = false;
  render();
});

$('#reverse').addEventListener('click', () => {
  if (!full()) { toast('请先完整填写四柱'); return; }
  $('#kbd').hidden = true;
  $('#results').hidden = false;
});

$('#res-back').addEventListener('click', () => {
  $('#results').hidden = true;
  $('#kbd').hidden = false;
});

[...document.querySelectorAll('.res-item')].forEach(r => r.addEventListener('click', () => {
  toast(`已选定 ${r.dataset.d}，将切回公历页复核`);
  $('#results').hidden = true;
  $('#kbd').hidden = false;
  render();
}));

render();
</script>
</body>
</html>
