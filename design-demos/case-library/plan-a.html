<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 A · 紧凑行卡 + 操作菜单</title>
<link rel="stylesheet" href="shared.css">
<style>
/* 方案 A：卡片全面瘦身（~96px），四柱文字化一行，日柱高亮；
   编辑/删除收进 ⋯ 菜单，拖拽手柄与底部提示收进「排序模式」 */
.acard {
  position: relative;
  background: #17181a;
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  padding: 10px 12px 9px;
  margin-bottom: 7px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.acard:active { background: #1c1d1f; }
.acard.sel { border-color: rgba(203,174,136,.45); box-shadow: 0 0 0 1px rgba(203,174,136,.25); }
.acard .r1 { display: flex; align-items: center; gap: 7px; }
.acard .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acard .age { margin-left: auto; font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
.acard .more {
  width: 26px; height: 26px;
  margin-right: -6px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted-2);
  font-size: 15px; letter-spacing: 1px;
  flex-shrink: 0;
}
.acard .more:active { background: rgba(255,255,255,.07); color: var(--text); }
.acard .pillars {
  display: flex; gap: 9px;
  margin: 7px 0 5px;
  font-size: 16px;
  padding-left: 1px;
}
.acard .r3 { display: flex; align-items: center; font-size: 11px; color: var(--muted-2); }
.acard .r3 .date { letter-spacing: .02em; }

/* 排序模式 */
.handle {
  position: absolute; left: 1px; top: 50%;
  transform: translateY(-50%);
  width: 18px; height: 44px;
  display: none; align-items: center; justify-content: center;
  color: var(--muted-2);
  font-size: 13px; letter-spacing: -1px;
  cursor: grab;
  touch-action: none;
}
body.sortmode .handle { display: flex; }
body.sortmode .acard { padding-left: 22px; cursor: default; }
body.sortmode .acard .more { display: none; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>1:36</span><span class="sb-icons"><i class="sb-dot on"></i><i class="sb-dot on"></i><i class="sb-dot"></i></span></div>
  <div class="page">
    <div class="phead">
      <button class="back">‹</button>
      <span class="title">案例库</span>
      <span class="count" id="total">(13)</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="sortBtn" title="排序模式">⇅</button>
    </div>
    <div class="toolbar">
      <div class="searchbox">
        <span class="s-ico">⌕</span>
        <input id="search" type="text" placeholder="搜索案例...">
      </div>
      <button class="tb-btn sec" id="importBtn">导入</button>
      <button class="tb-btn pri" id="createBtn">＋ 新建</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
    <div class="sortbar" id="sortbar" hidden><span>排序模式</span><b>拖动卡片左侧手柄</b><span>调整顺序，完成后点右上角退出</span></div>
  </div>

  <div class="sheet-mask" id="mask"></div>
  <div class="actionsheet" id="sheet">
    <div class="as-cap" id="sheetCap"></div>
    <button class="as-item" id="asEdit">编辑案例</button>
    <button class="as-item danger" id="asDelete">删除案例</button>
    <button class="as-cancel" id="asCancel">取消</button>
  </div>
  <div class="toast" id="toast"><span></span></div>
</div>

<script>
const TAGS = ['家人','恋人','自己','朋友','父母','案例'];
const CASES = [
  { id:'1',  name:'阿曾二女儿', g:'f', tag:'朋友', date:'2026-01-13', age:1,  p:['乙巳','己丑','丁亥','庚戌'] },
  { id:'2',  name:'羊刃格3',    g:'f', tag:'案例', date:'1995-04-03', age:32, p:['乙亥','己卯','甲子','丙寅'] },
  { id:'3',  name:'羊刃格2',    g:'f', tag:'案例', date:'1996-12-31', age:31, p:['丙子','庚子','壬寅','戊申'] },
  { id:'4',  name:'羊刃格1',    g:'m', tag:'案例', date:'1982-05-14', age:45, p:['壬戌','乙巳','丁酉','丙午'] },
  { id:'5',  name:'建禄格4',    g:'m', tag:'案例', date:'1995-06-04', age:32, p:['乙亥','辛巳','丙子','己亥'] },
  { id:'6',  name:'建禄格3',    g:'f', tag:'案例', date:'1996-02-15', age:31, p:['丙子','庚寅','壬午','壬寅'] },
  { id:'7',  name:'建禄格2',    g:'f', tag:'朋友', date:'1997-09-13', age:29, p:['丁丑','己酉','庚辰','戊寅'] },
  { id:'8',  name:'母亲',       g:'f', tag:'父母', date:'1962-08-09', age:64, p:['壬寅','己酉','己酉','甲子'] },
  { id:'9',  name:'父亲',       g:'m', tag:'父母', date:'1960-03-21', age:66, p:['庚子','己卯','辛丑','甲午'] },
  { id:'10', name:'林一',       g:'f', tag:'恋人', date:'1998-10-24', age:28, p:['戊寅','壬戌','癸卯','壬子'] },
  { id:'11', name:'本人',       g:'m', tag:'自己', date:'1993-11-08', age:33, p:['癸酉','癸亥','辛巳','壬辰'] },
  { id:'12', name:'姐姐',       g:'f', tag:'家人', date:'1990-06-30', age:36, p:['庚午','癸未','丁丑','癸卯'] },
  { id:'13', name:'爷爷',       g:'m', tag:'家人', date:'1936-03-05', age:90, p:['丙子','庚寅','戊戌','戊申'] },
];
const EL = { '甲':'e-wood','乙':'e-wood','丙':'e-fire','丁':'e-fire','戊':'e-earth','己':'e-earth','庚':'e-metal','辛':'e-metal','壬':'e-water','癸':'e-water','子':'e-water','丑':'e-earth','寅':'e-wood','卯':'e-wood','辰':'e-earth','巳':'e-fire','午':'e-fire','未':'e-earth','申':'e-metal','酉':'e-metal','戌':'e-earth','亥':'e-water' };
const cnDate = d => { const [y,m,day] = d.split('-'); return `${+y}年${+m}月${+day}日`; };

const $ = s => document.querySelector(s);
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.querySelector('span').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

let selectedTag = null, search = '', sortMode = false, menuCase = null;

// chips
const chipsEl = $('#chips');
function renderChips() {
  const counts = { all: CASES.length };
  TAGS.forEach(t => counts[t] = CASES.filter(c => c.tag === t).length);
  chipsEl.innerHTML = [`<button class="chip${selectedTag === null ? ' on' : ''}" data-t="">全部<span class="n">(${counts.all})</span></button>`]
    .concat(TAGS.map(t => `<button class="chip${selectedTag === t ? ' on' : ''}" data-t="${t}">${t}<span class="n">(${counts[t]})</span></button>`))
    .join('');
}
chipsEl.addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  selectedTag = c.dataset.t || null;
  renderChips();
  renderList();
});

function filtered() {
  return CASES.filter(c =>
    (!selectedTag || c.tag === selectedTag) &&
    (!search || c.name.includes(search) || c.date.includes(search)));
}

function ppHTML(pairs) {
  return pairs.map((pair, i) => {
    const inner = [...pair].map(ch => `<b class="${EL[ch]}">${ch}</b>`).join('');
    return `<span class="pp serif${i === 2 ? ' day' : ''}">${inner}</span>`;
  }).join('');
}

const listEl = $('#list');
function renderList() {
  const items = filtered();
  $('#total').textContent = `(${CASES.length})`;
  if (!items.length) {
    listEl.innerHTML = `<div class="empty">没有匹配的案例<br><span style="font-size:11px;">换个关键词或分类试试</span></div>`;
    return;
  }
  listEl.innerHTML = items.map(c => `
    <div class="acard${sortMode ? '' : ''}" data-id="${c.id}">
      <span class="handle">⣿</span>
      <div class="r1">
        <span class="seal ${c.g}">${c.g === 'm' ? '乾' : '坤'}</span>
        <span class="name">${c.name}</span>
        <span class="tagchip">${c.tag}</span>
        <span class="age">今年${c.age}岁</span>
        <button class="more" data-id="${c.id}">⋯</button>
      </div>
      <div class="pillars">${ppHTML(c.p)}</div>
      <div class="r3"><span class="date">${cnDate(c.date)}出生</span></div>
    </div>`).join('');
}

listEl.addEventListener('click', e => {
  const more = e.target.closest('.more');
  if (more) {
    menuCase = CASES.find(c => c.id === more.dataset.id);
    openSheet();
    return;
  }
  const handle = e.target.closest('.handle');
  if (handle) { toast('演示：按住手柄拖动排序'); return; }
  const card = e.target.closest('.acard');
  if (card && !sortMode) {
    const c = CASES.find(x => x.id === card.dataset.id);
    toast(`已选择「${c.name}」并载入排盘`);
  }
});

// 排序模式
$('#sortBtn').addEventListener('click', () => {
  sortMode = !sortMode;
  $('#sortBtn').classList.toggle('on', sortMode);
  $('#sortbar').hidden = !sortMode;
  renderList();
  if (sortMode) toast('已进入排序模式');
});

// 操作菜单
function openSheet() {
  $('#sheetCap').innerHTML = `<b>${menuCase.name}</b> · ${menuCase.tag} · 今年${menuCase.age}岁`;
  $('#mask').classList.add('show');
  $('#sheet').classList.add('show');
}
function closeSheet() {
  $('#mask').classList.remove('show');
  $('#sheet').classList.remove('show');
}
$('#mask').addEventListener('click', closeSheet);
$('#asCancel').addEventListener('click', closeSheet);
$('#asEdit').addEventListener('click', () => { closeSheet(); toast(`打开编辑「${menuCase.name}」`); });
$('#asDelete').addEventListener('click', () => {
  const i = CASES.findIndex(c => c.id === menuCase.id);
  CASES.splice(i, 1);
  closeSheet();
  renderChips();
  renderList();
  toast('已删除（演示）');
});

$('#search').addEventListener('input', e => { search = e.target.value.trim(); renderList(); });
$('#importBtn').addEventListener('click', () => toast('打开导入（演示）'));
$('#createBtn').addEventListener('click', () => toast('打开新建案例（演示）'));

renderChips();
renderList();
</script>
</body>
</html>
