<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 C · 分区列表 + 左滑操作</title>
<link rel="stylesheet" href="shared.css">
<style>
/* 方案 C：与导入界面一致的移动端交互模式——
   标签即分区（sticky 分组头替代筛选 chips），行更窄；
   左滑露出 编辑 / 删除，版面上不常驻任何操作按钮 */
.clist { padding: 0 10px 20px; }
.sec-h {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 6px;
  padding: 11px 8px 7px;
  background: linear-gradient(180deg, var(--bg) 82%, transparent);
  font-size: 12px; font-weight: 600;
  letter-spacing: .04em;
  color: var(--muted);
}
.sec-h .n { font-weight: 400; opacity: .6; }
.sec-h .ln { flex: 1; height: 1px; background: var(--border-soft); }

.rowwrap {
  position: relative;
  border-radius: 12px;
  margin-bottom: 6px;
  overflow: hidden;
}
.row-actions {
  position: absolute; top: 0; right: 0; bottom: 0;
  display: flex;
  z-index: 1;
}
.row-actions button {
  width: 68px;
  font-size: 12.5px; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
.row-actions .ra-edit { background: #2a2b2e; color: var(--primary); }
.row-actions .ra-del { background: var(--danger-soft); color: var(--danger); }

.row {
  position: relative; z-index: 2;
  background: #17181a;
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  padding: 9px 12px 8px;
  cursor: pointer;
  transition: transform .18s;
  touch-action: pan-y;
}
.row.sel { border-color: rgba(203,174,136,.45); box-shadow: 0 0 0 1px rgba(203,174,136,.25); }
.row .r1 { display: flex; align-items: center; gap: 7px; }
.row .name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .age { margin-left: auto; font-size: 11px; color: var(--muted); flex-shrink: 0; }
.row .pillars { display: flex; gap: 8px; margin-top: 5px; font-size: 14.5px; padding-left: 1px; }

.handle {
  position: absolute; left: 1px; top: 50%;
  transform: translateY(-50%);
  width: 18px; height: 40px;
  display: none; align-items: center; justify-content: center;
  color: var(--muted-2);
  font-size: 13px; letter-spacing: -1px;
  cursor: grab;
  touch-action: none;
  z-index: 3;
}
body.sortmode .handle { display: flex; }
body.sortmode .row { padding-left: 22px; cursor: default; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>1:36</span><span class="sb-icons"><i class="sb-dot on"></i><i class="sb-dot on"></i><i class="sb-dot"></i></span></div>
  <div class="page">
    <div class="phead">
      <button class="back">‹</button>
      <span class="title">案例库</span>
      <span class="count" id="total">(13)</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="sortBtn" title="排序模式">⇅</button>
    </div>
    <div class="toolbar">
      <div class="searchbox">
        <span class="s-ico">⌕</span>
        <input id="search" type="text" placeholder="搜索案例...">
      </div>
      <button class="tb-btn sec" id="importBtn">导入</button>
      <button class="tb-btn pri" id="createBtn">＋ 新建</button>
    </div>
    <div class="list clist" id="list"></div>
    <div class="sortbar" id="sortbar" hidden><span>排序模式</span><b>拖动卡片左侧手柄</b><span>在分区内调整顺序</span></div>
  </div>
  <div class="toast" id="toast"><span></span></div>
</div>

<script>
const TAGS = ['家人','恋人','自己','朋友','父母','案例'];
const CASES = [
  { id:'1',  name:'阿曾二女儿', g:'f', tag:'朋友', date:'2026-01-13', age:1,  p:['乙巳','己丑','丁亥','庚戌'] },
  { id:'2',  name:'羊刃格3',    g:'f', tag:'案例', date:'1995-04-03', age:32, p:['乙亥','己卯','甲子','丙寅'] },
  { id:'3',  name:'羊刃格2',    g:'f', tag:'案例', date:'1996-12-31', age:31, p:['丙子','庚子','壬寅','戊申'] },
  { id:'4',  name:'羊刃格1',    g:'m', tag:'案例', date:'1982-05-14', age:45, p:['壬戌','乙巳','丁酉','丙午'] },
  { id:'5',  name:'建禄格4',    g:'m', tag:'案例', date:'1995-06-04', age:32, p:['乙亥','辛巳','丙子','己亥'] },
  { id:'6',  name:'建禄格3',    g:'f', tag:'案例', date:'1996-02-15', age:31, p:['丙子','庚寅','壬午','壬寅'] },
  { id:'7',  name:'建禄格2',    g:'f', tag:'朋友', date:'1997-09-13', age:29, p:['丁丑','己酉','庚辰','戊寅'] },
  { id:'8',  name:'母亲',       g:'f', tag:'父母', date:'1962-08-09', age:64, p:['壬寅','己酉','己酉','甲子'] },
  { id:'9',  name:'父亲',       g:'m', tag:'父母', date:'1960-03-21', age:66, p:['庚子','己卯','辛丑','甲午'] },
  { id:'10', name:'林一',       g:'f', tag:'恋人', date:'1998-10-24', age:28, p:['戊寅','壬戌','癸卯','壬子'] },
  { id:'11', name:'本人',       g:'m', tag:'自己', date:'1993-11-08', age:33, p:['癸酉','癸亥','辛巳','壬辰'] },
  { id:'12', name:'姐姐',       g:'f', tag:'家人', date:'1990-06-30', age:36, p:['庚午','癸未','丁丑','癸卯'] },
  { id:'13', name:'爷爷',       g:'m', tag:'家人', date:'1936-03-05', age:90, p:['丙子','庚寅','戊戌','戊申'] },
];
const EL = { '甲':'e-wood','乙':'e-wood','丙':'e-fire','丁':'e-fire','戊':'e-earth','己':'e-earth','庚':'e-metal','辛':'e-metal','壬':'e-water','癸':'e-water','子':'e-water','丑':'e-earth','寅':'e-wood','卯':'e-wood','辰':'e-earth','巳':'e-fire','午':'e-fire','未':'e-earth','申':'e-metal','酉':'e-metal','戌':'e-earth','亥':'e-water' };
const cnDate = d => { const [y,m,day] = d.split('-'); return `${+y}年${+m}月${+day}日`; };

const $ = s => document.querySelector(s);
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.querySelector('span').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

let search = '', sortMode = false, openId = null;

function filtered() {
  return CASES.filter(c => !search || c.name.includes(search) || c.date.includes(search));
}

function ppHTML(pairs) {
  return pairs.map((pair, i) => {
    const inner = [...pair].map(ch => `<b class="${EL[ch]}">${ch}</b>`).join('');
    return `<span class="pp serif${i === 2 ? ' day' : ''}">${inner}</span>`;
  }).join('');
}

const listEl = $('#list');
function renderList() {
  const items = filtered();
  $('#total').textContent = `(${CASES.length})`;
  if (!items.length) {
    listEl.innerHTML = `<div class="empty">没有匹配的案例<br><span style="font-size:11px;">换个关键词试试</span></div>`;
    return;
  }
  // 分区：按标签顺序分组，组内保持手动排序
  const groups = TAGS.map(t => ({ tag: t, items: items.filter(c => c.tag === t) })).filter(g => g.items.length);
  listEl.innerHTML = groups.map(g => `
    <div class="sec-h"><span>${g.tag}</span><span class="n">(${g.items.length})</span><span class="ln"></span></div>
    ${g.items.map(c => `
      <div class="rowwrap" data-id="${c.id}">
        <div class="row-actions">
          <button class="ra-edit" data-id="${c.id}">✎<span>编辑</span></button>
          <button class="ra-del" data-id="${c.id}">✕<span>删除</span></button>
        </div>
        <div class="row" data-id="${c.id}">
          <span class="handle">⣿</span>
          <div class="r1">
            <span class="seal ${c.g}">${c.g === 'm' ? '乾' : '坤'}</span>
            <span class="name">${c.name}</span>
            <span class="age">今年${c.age}岁</span>
          </div>
          <div class="pillars">${ppHTML(c.p)}</div>
        </div>
      </div>`).join('')}`).join('');
}

// 左滑操作
let swiping = null, startX = 0, dx = 0, suppressClick = false;
const REVEAL = 140;
listEl.addEventListener('pointerdown', e => {
  const row = e.target.closest('.row');
  if (!row || sortMode) return;
  closeOpen();
  swiping = row; startX = e.clientX; dx = 0;
  row.style.transition = 'none';
  row.setPointerCapture?.(e.pointerId);
});
listEl.addEventListener('pointermove', e => {
  if (!swiping) return;
  dx = e.clientX - startX;
  if (dx > 0) dx = 0;
  swiping.style.transform = `translateX(${Math.max(dx, -REVEAL)}px)`;
});
function endSwipe() {
  if (!swiping) return;
  const row = swiping; swiping = null;
  row.style.transition = '';
  if (Math.abs(dx) > 8) suppressClick = true; // 滑动后浏览器补发的 click 不当作点选
  if (dx < -44) {
    row.style.transform = `translateX(${-REVEAL}px)`;
    openId = row.dataset.id;
  } else {
    row.style.transform = '';
    openId = null;
  }
}
listEl.addEventListener('pointerup', endSwipe);
listEl.addEventListener('pointercancel', endSwipe);
function closeOpen() {
  if (!openId) return;
  const r = listEl.querySelector(`.row[data-id="${openId}"]`);
  if (r) r.style.transform = '';
  openId = null;
}

listEl.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; return; }
  const edit = e.target.closest('.ra-edit');
  if (edit) {
    const c = CASES.find(x => x.id === edit.dataset.id);
    toast(`打开编辑「${c.name}」`);
    return;
  }
  const del = e.target.closest('.ra-del');
  if (del) {
    const i = CASES.findIndex(x => x.id === del.dataset.id);
    const [gone] = CASES.splice(i, 1);
    openId = null;
    renderList();
    toast(`已删除「${gone.name}」（演示）`);
    return;
  }
  const handle = e.target.closest('.handle');
  if (handle) { toast('演示：按住手柄拖动排序'); return; }
  const row = e.target.closest('.row');
  if (row) {
    if (openId === row.dataset.id) { closeOpen(); return; }
    if (sortMode) return;
    const c = CASES.find(x => x.id === row.dataset.id);
    toast(`已选择「${c.name}」并载入排盘`);
  }
});

$('#sortBtn').addEventListener('click', () => {
  sortMode = !sortMode;
  $('#sortBtn').classList.toggle('on', sortMode);
  $('#sortbar').hidden = !sortMode;
  closeOpen();
  renderList();
  if (sortMode) toast('已进入排序模式');
});

$('#search').addEventListener('input', e => { search = e.target.value.trim(); renderList(); });
$('#importBtn').addEventListener('click', () => toast('打开导入（演示）'));
$('#createBtn').addEventListener('click', () => toast('打开新建案例（演示）'));

renderList();
</script>
</body>
</html>
