<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 B · 操作分区列表</title>
<link rel="stylesheet" href="shared.css">
<style>
/* 方案 B：整个上传步骤是一张分区列表卡，所有动作都是 52px 行，系统分享面板质感 */
.list-card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  overflow: hidden;
}
.row-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px;
  min-height: 56px;
  cursor: pointer;
  transition: background .15s;
  width: 100%; border: none; background: transparent;
  color: var(--text); text-align: left; font-family: inherit;
}
.row-item:active { background: var(--surface-2); }
.row-item + .row-item { border-top: 1px solid var(--border-soft); }
.row-ico {
  width: 36px; height: 36px; border-radius: 9px;
  background: #232426; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); flex-shrink: 0;
}
.row-item.hero .row-ico {
  width: 42px; height: 42px; border-radius: 11px;
  background: var(--primary-soft); border-color: rgba(203,174,136,.25);
  color: var(--primary);
}
.row-main { flex: 1; min-width: 0; }
.row-t { font-size: 14px; font-weight: 600; }
.row-item.hero .row-t { font-size: 15px; }
.row-d { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
.chev { color: #55565a; flex-shrink: 0; transition: transform .2s; }
.chev.open { transform: rotate(90deg); }

.acc { display: none; padding: 2px 16px 14px; }
.acc.open { display: block; }
.acc .paste-area {
  width: 100%; min-height: 110px; resize: none;
  background: var(--panel); border: 1px solid var(--border-soft); border-radius: 10px;
  padding: 10px 12px; color: var(--text); font-size: 12px; line-height: 1.6;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  outline: none;
}
.acc .paste-area:focus { border-color: var(--primary-border); }
.acc .parse-btn {
  margin-top: 10px; height: 38px; padding: 0 18px;
  border: none; border-radius: 9px;
  background: var(--primary); color: var(--primary-fg);
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.acc .ftable-wrap {
  background: var(--panel); border: 1px solid var(--border-soft);
  border-radius: 10px; padding: 2px 4px; margin-top: 4px;
}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>12:10</span><span class="sb-icons"><span class="sb-dot on"></span><span class="sb-dot on"></span><span class="sb-dot"></span></span></div>

  <div class="page">
    <div class="phead">
      <button class="back" onclick="backNav()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      导入八字案例
    </div>

    <div class="stepper" id="stepper">
      <div class="st" data-s="0"><div class="dot">1</div><span class="lbl">上传文件</span></div>
      <div class="ln"></div>
      <div class="st" data-s="1"><div class="dot">2</div><span class="lbl">预览数据</span></div>
      <div class="ln"></div>
      <div class="st" data-s="2"><div class="dot">3</div><span class="lbl">完成导入</span></div>
    </div>

    <!-- 步骤 1：上传（分区列表） -->
    <div class="scroll" id="st-upload">
      <div class="sec-label">导入</div>
      <div class="list-card">
        <button class="row-item hero" onclick="pickFile()">
          <span class="row-ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          </span>
          <span class="row-main">
            <span class="row-t" style="display:block">选择 JSON 文件</span>
            <span class="row-d" style="display:block">从本机文件中选取 · 支持批量导入</span>
          </span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <div class="sec-label mt">没有现成数据？</div>
      <div class="list-card">
        <button class="row-item" onclick="toggleAcc('accPaste', this)">
          <span class="row-ico">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
          </span>
          <span class="row-main">
            <span class="row-t" style="display:block">粘贴 JSON 数据</span>
            <span class="row-d" style="display:block">从聊天 / 笔记复制后直接粘贴解析</span>
          </span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div class="acc" id="accPaste">
          <textarea class="paste-area" placeholder='[{"姓名":"张三","性别":"男","出生时间":"1990-05-20 10:30"}]'></textarea>
          <button class="parse-btn" onclick="pasteParse()">解析并预览</button>
        </div>

        <button class="row-item" onclick="saveTemplate()">
          <span class="row-ico">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
          </span>
          <span class="row-main">
            <span class="row-t" style="display:block">保存标准模板</span>
            <span class="row-d" style="display:block">写入系统「下载」目录 · import_template.json</span>
          </span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>

        <button class="row-item" onclick="toggleAcc('accFields', this)">
          <span class="row-ico">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          </span>
          <span class="row-main">
            <span class="row-t" style="display:block">查看字段说明</span>
            <span class="row-d" style="display:block">五个字段 · 均为中文键名</span>
          </span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div class="acc" id="accFields">
          <div class="ftable-wrap">
            <table class="ftable">
              <tr><th>字段</th><th>填写</th><th>示例</th></tr>
              <tr><td>姓名</td><td><span class="req">必填</span></td><td class="mono">张三</td></tr>
              <tr><td>性别</td><td><span class="req">必填</span></td><td>男 / 女</td></tr>
              <tr><td>出生时间</td><td><span class="req">必填</span></td><td class="mono">1990-05-20 10:30</td></tr>
              <tr><td>标签</td><td>选填</td><td>客户</td></tr>
              <tr><td>备注</td><td>选填</td><td>事业咨询案例</td></tr>
            </table>
          </div>
        </div>
      </div>

      <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.7">模板与字段说明也适用于奇门案例导入</p>
    </div>

    <!-- 步骤 2：预览 -->
    <div class="scroll" id="st-preview" hidden>
      <div class="pv-head"><h3>预览数据</h3><span class="pv-chip" id="pvCount"></span></div>
      <div class="pv-panel" id="pvList"></div>
    </div>
    <div class="fbar" id="fb-preview" hidden>
      <button class="ghost" onclick="go('upload')">重新上传</button>
      <button class="primary-btn" onclick="doImport()">确认导入</button>
    </div>

    <!-- 步骤 3：处理中 -->
    <div class="center-step" id="st-importing" hidden>
      <div class="spin"></div>
      <h2 style="margin-top:22px">正在导入...</h2>
    </div>

    <!-- 步骤 4：结果 -->
    <div class="center-step" id="st-result" hidden>
      <div class="ok-ico">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h2>导入成功</h2>
      <p class="desc">成功导入 <b id="okCount">8</b> 条数据</p>
      <button class="primary-btn" onclick="go('upload')">完成</button>
    </div>
  </div>

  <div class="toast" id="toast"><span class="tick">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>
  </span><span id="toastMsg"></span></div>
</div>

<script>
const MOCK = [
  { name: '阿曾二女儿', date: '2026-01-13 12:00', gender: 'f', tags: ['朋友'] },
  { name: '羊刃格3',    date: '1995-04-02 20:00', gender: 'f', tags: ['案例'] },
  { name: '羊刃格2',    date: '1996-12-31 08:00', gender: 'f', tags: ['案例'] },
  { name: '羊刃格1',    date: '1982-05-14 04:00', gender: 'm', tags: ['案例'] },
  { name: '建禄格4',    date: '1995-06-04 14:00', gender: 'm', tags: ['案例'] },
  { name: '建禄格3',    date: '1988-11-27 06:30', gender: 'f', tags: ['客户'] },
  { name: '正官格1',    date: '1990-05-20 10:30', gender: 'm', tags: ['客户'] },
  { name: '偏印格2',    date: '2001-03-08 22:15', gender: 'f', tags: ['案例', '复盘'] },
];

let cur = 'upload';

function go(step) {
  cur = step;
  ['upload', 'preview', 'importing', 'result'].forEach(s => {
    document.getElementById('st-' + s).hidden = (s !== step);
  });
  document.getElementById('fb-preview').hidden = (step !== 'preview');
  const idx = { upload: 0, preview: 1, importing: 2, result: 2 }[step];
  document.querySelectorAll('#stepper .st').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('done', i < idx);
    el.querySelector('.dot').innerHTML = (i < idx)
      ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>'
      : (i + 1);
  });
  document.querySelector('.scroll')?.scrollTo(0, 0);
}

function backNav() {
  if (cur === 'preview') go('upload');
  else toast('演示：此处返回案例列表');
}

function pickFile() { renderPreview(MOCK); }
function pasteParse() { renderPreview(MOCK); }

function toggleAcc(id, btn) {
  const acc = document.getElementById(id);
  const open = acc.classList.toggle('open');
  btn.querySelector('.chev').classList.toggle('open', open);
}

function renderPreview(list) {
  document.getElementById('pvCount').textContent = list.length + ' 条记录';
  document.getElementById('pvList').innerHTML = list.map((c, i) => `
    <div class="case-card" style="animation-delay:${i * 30}ms">
      <div class="cc-top"><span class="cc-name">${c.name}</span><span class="cc-idx mono">#${i + 1}</span></div>
      <div class="cc-date mono">${c.date}</div>
      <div class="cc-foot">
        <span class="cc-gender ${c.gender}">${c.gender === 'm' ? '男命' : '女命'}</span>
        <span class="cc-tags">${c.tags.map(t => `<span class="cc-tag">${t}</span>`).join('')}</span>
      </div>
    </div>`).join('');
  go('preview');
}

function doImport() {
  go('importing');
  setTimeout(() => {
    document.getElementById('okCount').textContent = MOCK.length;
    go('result');
  }, 900);
}

/* 模拟 exportTextFile 的安卓路径：OrbisNative 桥 → MediaStore 写入系统「下载」目录 */
function saveTemplate() {
  toast('已保存到「下载」目录 · import_template.json');
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
