<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 A · 资料优先行卡（224px）</title>
<link rel="stylesheet" href="shared.css">
<style>
/* A = 八字定稿 CaseCard 的同构版：保留「左资料 / 右四柱」结构，只换奇门元素。
    改动点：姓名 → 案例标题（13px 省略）；乾/坤印章 → 分类 chip 两字简称（同行）；
    第二行 = 占测日期 · 时刻 + 反馈状态（起局时辰不单写 —— 四柱时柱已含时辰）；
    四柱 = 占测时刻的真实四柱，压到 14px 竖排、仅日干取五行色。
    224px 实测：卡片内容 190px，其中四柱 60px，左侧信息列 123px。
    宽度核算：r1 ≈ 标题90 + chip28；r2 = 日期30 · 时刻30 + 状态34 ≈ 108px（不溢出）。 */
.card { padding: 8px 9px; }
.rowmain {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
}
.binfo { min-width: 0; flex: 1; overflow: hidden; }

.r1 { display: flex; align-items: center; gap: 5px; min-width: 0; }
.title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.tagchip {
  flex-shrink: 0;
  height: 15px;
  padding: 0 4px;
  border-radius: 4px;
  font-size: 10px;
  line-height: 1;
  display: inline-flex; align-items: center;
  background: var(--primary-soft);
  color: var(--primary);
}

.r2 {
  display: flex; align-items: center; gap: 4px;
  margin-top: 4px;
  font-size: 10.5px;
  color: var(--muted-2);
  min-width: 0;
  white-space: nowrap;
}
.r2 > * { flex-shrink: 0; }
.r2 .dot { width: 2.5px; height: 2.5px; border-radius: 50%; background: #3a3b3e; }
.r2 .st { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0; }
.r2 .st i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted-2); }
.r2 .st.ok { color: var(--success); }
.r2 .st.ok i { background: var(--success); }

/* 四柱：干上支下，柱宽 15px / 字号 14px（与八字定稿同度量） */
.mc { display: flex; gap: 0; flex-shrink: 0; }
.mc-col { width: 15px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.mc-col span { font-size: 14px; font-weight: 600; line-height: 1.3; }
</style>
</head>
<body>
<div class="stage">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="hrow">
        <button class="sb-title" id="openLibrary">案例库</button>
        <span class="sb-count" id="total">(12)</span>
      </div>
      <div class="filters" id="chips"></div>
      <div class="searchbox">
        <span class="s-ico">⌕</span>
        <input id="search" type="text" placeholder="搜索案例...">
      </div>
      <div class="actions">
        <button class="abtn icon" id="exportBtn" title="导出">↑</button>
        <button class="abtn icon" id="importBtn" title="导入">↓</button>
        <button class="abtn primary" id="createBtn">＋ 新建</button>
      </div>
    </div>
    <div class="sb-body"><div class="list" id="list"></div></div>
  </aside>
</div>
<div class="toast" id="toast"><span></span></div>

<script src="app.js"></script>
<script>
/* 每张卡高度目标 ≈ 53px（现状约 96px），三稿最矮 */
renderCard = function (c) {
  const dayGan = c.p[2][0];
  return `
  <div class="card">
    <div class="rowmain">
      <div class="binfo">
        <div class="r1">
          <span class="title" title="${c.t}">${c.t}</span>
          <span class="tagchip">${CAT_NAME(c.cat).slice(0, 2)}</span>
        </div>
        <div class="r2">
          <span class="date">${mdDate(c.date)}</span>
          <span class="dot"></span>
          <span class="time">${c.time}</span>
          <span class="st ${c.st ? 'ok' : ''}"><i></i>${c.st ? '已验' : '待验'}</span>
        </div>
      </div>
      <div class="mc">
        ${c.p.map(([g, z], i) => `
          <div class="mc-col serif">
            <span class="${i === 2 ? EL[dayGan] : 'g-plain'}">${g}</span>
            <span class="g-plain">${z}</span>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
};
renderList();
</script>
</body>
</html>
