<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 C · 描述优先文字卡（224px）</title>
<link rel="stylesheet" href="shared.css">
<style>
/* C = 放弃盘面、把宽度全给文字：奇门案例靠「占测问题」识别，标题与描述才是检索抓手。
    三行结构：r1 标题全宽 + 分类 chip 全名（行尾）；
    r2 描述摘要一行（11.5px 压暗，hover 出 title 全文）；
    r3 反馈状态（左）+ 占测日期 · 时刻（右对齐，与八字底行同构）。
    224px 实测：卡片内容 190px。
    宽度核算：r1 ≈ 标题137 + chip48；r3 = 状态34 + 日期56 · 时刻29 ≈ 125px（不溢出）。 */
.card { padding: 8px 9px; }

.r1 { display: flex; align-items: center; gap: 5px; min-width: 0; }
.title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.tagchip {
  flex-shrink: 0;
  height: 15px;
  padding: 0 4px;
  border-radius: 4px;
  font-size: 10px;
  line-height: 1;
  display: inline-flex; align-items: center;
  background: var(--primary-soft);
  color: var(--primary);
}

.r2 {
  margin-top: 3px;
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--muted-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.r3 {
  display: flex; align-items: center; gap: 4px;
  margin-top: 4px;
  font-size: 10.5px;
  color: var(--muted-2);
  white-space: nowrap;
}
.r3 .st { display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0; }
.r3 .st i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted-2); }
.r3 .st.ok { color: var(--success); }
.r3 .st.ok i { background: var(--success); }
.r3 .when { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
.r3 .when .dot { width: 2.5px; height: 2.5px; border-radius: 50%; background: #3a3b3e; }
</style>
</head>
<body>
<div class="stage">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="hrow">
        <button class="sb-title" id="openLibrary">案例库</button>
        <span class="sb-count" id="total">(12)</span>
      </div>
      <div class="filters" id="chips"></div>
      <div class="searchbox">
        <span class="s-ico">⌕</span>
        <input id="search" type="text" placeholder="搜索案例...">
      </div>
      <div class="actions">
        <button class="abtn icon" id="exportBtn" title="导出">↑</button>
        <button class="abtn icon" id="importBtn" title="导入">↓</button>
        <button class="abtn primary" id="createBtn">＋ 新建</button>
      </div>
    </div>
    <div class="sb-body"><div class="list" id="list"></div></div>
  </aside>
</div>
<div class="toast" id="toast"><span></span></div>

<script src="app.js"></script>
<script>
/* 每张卡高度目标 ≈ 70px：一行描述换检索效率，无盘面元素 */
renderCard = function (c) {
  return `
  <div class="card">
    <div class="r1">
      <span class="title" title="${c.t}">${c.t}</span>
      <span class="tagchip">${CAT_NAME(c.cat)}</span>
    </div>
    <div class="r2" title="${c.desc}">${c.desc}</div>
    <div class="r3">
      <span class="st ${c.st ? 'ok' : ''}"><i></i>${c.st ? '已验' : '待验'}</span>
      <span class="when">
        <span class="date">${c.date}</span>
        <span class="dot"></span>
        <span class="time">${c.time}</span>
      </span>
    </div>
  </div>`;
};
renderList();
</script>
</body>
</html>
