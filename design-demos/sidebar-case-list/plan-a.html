<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 A · 双行紧凑行卡（224px）</title>
<link rel="stylesheet" href="shared.css">
<style>
/* A = 现状 CaseCard 的瘦身版：保留「左侧资料 / 右侧四柱」的既有结构，只重排版面
   改动点：四柱由 19px 收到 15px、柱宽 24→18；姓名行与日期行改用 2 行网格；
   分类 chip 上移到第一行（姓名右侧有空档），性别印章紧跟姓名之后；
   第二行 = 出生日期 + 出生时辰（不再显示年龄）。
   224px 可用宽度实测：卡片内容 186px，其中四柱 76px，左侧信息 102px。 */
.card { padding: 8px 9px; }
.rowmain {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
}
.binfo { min-width: 0; flex: 1; overflow: hidden; }

.r1 { display: flex; align-items: center; gap: 5px; min-width: 0; }
.name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.seal {
  flex-shrink: 0;
  width: 17px; height: 17px;
  border-radius: 4px;
  font-size: 10.5px;
  line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
}
.seal.m { background: var(--male-soft); color: var(--male); }
.seal.f { background: var(--female-soft); color: var(--female); }

.r2 {
  display: flex; align-items: center; gap: 4px;
  margin-top: 4px;
  font-size: 10.5px;
  color: var(--muted-2);
  min-width: 0;
  white-space: nowrap;
}
/* 100px 里只放 日期 + 出生时辰两项；日期是唯一可省略项，避免撑破卡片 */
.r2 > * { flex-shrink: 0; }
.r2 .date {
  flex-shrink: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.r2 .time { font-variant-numeric: tabular-nums; }
.r2 .dot { width: 2.5px; height: 2.5px; border-radius: 50%; background: #3a3b3e; flex-shrink: 0; }

/* 分类 chip 与姓名同行：姓名超长时 chip 优先保留 */
.tagchip {
  flex-shrink: 0;
  height: 15px;
  padding: 0 4px;
  border-radius: 4px;
  font-size: 10px;
  line-height: 1;
  display: inline-flex; align-items: center;
  background: var(--primary-soft);
  color: var(--primary);
}

/* 四柱：干上支下。224px 下宽度的第一矛盾方，故柱宽压到 15px、字号 14px。
   15px×4 = 60px，比原 16px+1px 间距的 68px 省 8px，全部让给左侧文字列；
   留出的余量必须覆盖「12月31日」这类最长日期（实测需 75.6px），否则省略号会吃掉末位数字。 */
.mc { display: flex; gap: 0; flex-shrink: 0; }
.mc-col { width: 15px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.mc-col span { font-size: 14px; font-weight: 600; line-height: 1.3; }
</style>
</head>
<body>
<div class="stage">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="hrow">
        <button class="sb-title" id="openLibrary">案例库</button>
        <span class="sb-count" id="total">(12)</span>
      </div>
      <div class="filters" id="chips"></div>
      <div class="searchbox">
        <span class="s-ico">⌕</span>
        <input id="search" type="text" placeholder="搜索案例...">
      </div>
      <div class="actions">
        <button class="abtn icon" id="exportBtn" title="导出">↑</button>
        <button class="abtn icon" id="importBtn" title="导入">↓</button>
        <button class="abtn primary" id="createBtn">＋ 新建</button>
        <button class="abtn icon" id="sortBtn" title="排序模式">⇅</button>
      </div>
    </div>
    <div class="sb-body"><div class="list" id="list"></div></div>
  </aside>
</div>
<div class="toast" id="toast"><span></span></div>

<script src="app.js"></script>
<script>
/* 每张卡高度目标 ≈ 58px（现状约 96px） */
renderCard = function (c) {
  const dayGan = c.p[2][0];
  return `
  <div class="card">
    <div class="rowmain">
      <div class="binfo">
        <div class="r1">
          <span class="name">${c.name}</span>
          <span class="seal ${c.g}">${c.g === 'm' ? '乾' : '坤'}</span>
          <span class="tagchip">${c.tag}</span>
        </div>
        <div class="r2">
          <span class="date">${cnDate(c.date)}</span>
          <span class="dot"></span>
          <span class="time">${c.time}</span>
        </div>
      </div>
      <div class="mc">
        ${c.p.map(([g, z], i) => `
          <div class="mc-col serif">
            <span class="${i === 2 ? EL[dayGan] : 'g-plain'}">${g}</span>
            <span class="g-plain">${z}</span>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
};
renderList();
</script>
</body>
</html>
