<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/logo/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="玄枢录 - 聚合多种排盘工具" />
  <title>玄枢录</title>
  <!-- 不用 Google Fonts 外链：fonts.googleapis/gstatic 在国内 WebView 中 TLS 握手失败或超时，
       而 <link rel="stylesheet"> 是渲染阻塞资源，会让首帧一直白屏（网络差时可达数十秒）。
       字体统一回退系统字体栈（见 index.css 的 --font-sans/serif/mono）。 -->
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var isDark = stored ? stored === 'dark' : true;
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
