[package]
name = "app"
version = "2.1.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建专用：嵌入前端资源走自定义协议，产物可完全离线运行。
# 绝不能进 default——Tauri 以 `dev = !custom_protocol` 判定运行模式，
# debug 构建若带上它，运行时会去加载内嵌资源而非 devUrl，热更新随即失效。
# `tauri build` / `tauri android build` 会自动追加，手工 cargo 构建需显式传入。
custom-protocol = ["tauri/custom-protocol"]

# 管理员版专用：在应用内直接签发激活码（需 keys/signing_blob.rs，见 cases-keygen export-signing）。
# 普通版（GitHub Actions）不带该 feature，构建产物不含签发代码路径。
admin-signing = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2.5.2"
tauri-plugin-sql = { version = "2.3.0", features = ["sqlite"] }
tauri-plugin-dialog = "2"

# 案例离线加密包（docs/case-encryption-and-activation-spec.md）
ed25519-dalek = "2"
aes-gcm = "0.10"
argon2 = "0.5"
# 0.31 与 tauri-plugin-sql(sqlx 0.8) 共用 libsqlite3-sys 0.28，避免原生库重复链接
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
hex = "0.4"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
